          | classical | {s['classical_providers']} | {s['classical_rules']} |

          ## Conservation Equation

          ```text
          source_rules_total
          =
          deprecated_source_rules
          + markers_removed
          + ios_process_filtered
          + duplicates_removed
          + output_rules
