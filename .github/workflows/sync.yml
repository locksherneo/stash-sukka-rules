      # ==========================================================
      # 21. Final repository audit
      # ==========================================================

      - name: Final validation
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail


          python3 <<'PY'
          from pathlib import Path
          import json
          import ipaddress


          audit = json.loads(
              Path(
                  "SEMANTIC_AUDIT.json"
              ).read_text(
                  encoding="utf-8"
              )
          )


          s = audit["summary"]


          if s["unaccounted_rules"] != 0:

              raise RuntimeError(
                  "Final semantic integrity "
                  "audit failed."
              )


          marker_suffix = (
              ".m4d3.by.5ukk4w.skk.moe"
          )


          for root_name in (
              "domain",
              "ipcidr",
              "classical",
          ):

              root = Path(root_name)


              for file in root.rglob("*.txt"):

                  for lineno, raw in enumerate(
                      file.read_text(
                          encoding="utf-8",
                          errors="ignore"
                      ).splitlines(),
                      1
                  ):

                      if (
                          marker_suffix
                          in raw.lower()
                      ):

                          raise RuntimeError(
                              f"{file}:{lineno}: "
                              f"Sukka Marker remained"
                          )


          for file in Path(
              "classical"
          ).rglob("*.txt"):

              for lineno, raw in enumerate(
                  file.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  ).splitlines(),
                  1
              ):

                  rule_type = (
                      raw
                      .split(",", 1)[0]
                      .strip()
                      .upper()
                  )


                  if rule_type in {
                      "PROCESS-NAME",
                      "PROCESS-PATH",
                  }:

                      raise RuntimeError(
                          f"{file}:{lineno}: "
                          f"PROCESS rule remained"
                      )


          for file in Path(
              "ipcidr"
          ).glob("*.txt"):

              for lineno, raw in enumerate(
                  file.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  ).splitlines(),
                  1
              ):

                  line = raw.strip()


                  if not line:
                      continue


                  try:

                      ipaddress.ip_network(
                          line,
                          strict=False
                      )


                  except ValueError as exc:

                      raise RuntimeError(
                          f"{file}:{lineno}: "
                          f"invalid CIDR {line}"
                      ) from exc


          required = [
              "RULES_SHA256SUMS.txt",
              "RULES_VERSION.sha256",
              "CONVERSION_REPORT.md",
              "SEMANTIC_AUDIT.json",
              "SEMANTIC_AUDIT.md",
          ]


          for filename in required:

              path = Path(filename)

              if not path.is_file():

                  raise RuntimeError(
                      f"Missing {filename}"
                  )


              if path.stat().st_size == 0:

                  raise RuntimeError(
                      f"Empty {filename}"
                  )


          print("")
          print("====================================")
          print(" Final Repository Audit")
          print("====================================")
          print(
