name: Sukka List to Stash V1.4.2.1 Semantic Integrity Bugfix Final

on:
  workflow_dispatch:

  schedule:
    # 每天 UTC 06:20 自动检查一次
    - cron: "20 6 * * *"

permissions:
  contents: write

concurrency:
  group: sukka-stash-ios-sync
  cancel-in-progress: false


jobs:

  sync:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SOURCE_BASE: https://ruleset.skk.moe
      MIN_TOTAL_PROVIDERS: 20


    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # ==========================================================
      # 2. Configure Git
      # ==========================================================

      - name: Configure Git
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


      # ==========================================================
      # 3. Prepare workspace
      # ==========================================================

      - name: Prepare workspace
        run: |
          set -euo pipefail

          rm -rf /tmp/sukka-stash

          mkdir -p /tmp/sukka-stash/source/domainset
          mkdir -p /tmp/sukka-stash/source/non_ip
          mkdir -p /tmp/sukka-stash/source/ip

          mkdir -p /tmp/sukka-stash/output/domain/domainset
          mkdir -p /tmp/sukka-stash/output/domain/non_ip
          mkdir -p /tmp/sukka-stash/output/ipcidr
          mkdir -p /tmp/sukka-stash/output/classical/non_ip
          mkdir -p /tmp/sukka-stash/output/classical/ip


      # ==========================================================
      # 4. Fetch Sukka index
      # ==========================================================

      - name: Fetch Sukka index
        run: |
          set -euo pipefail

          echo "Fetching Sukka index..."

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 60 \
            "${SOURCE_BASE}/" \
            -o /tmp/sukka-stash/index.html

          if [ ! -s /tmp/sukka-stash/index.html ]; then
            echo "ERROR: Sukka index is empty."
            exit 1
          fi

          SIZE=$(wc -c < /tmp/sukka-stash/index.html)

          echo "Index size: ${SIZE} bytes"

          if [ "${SIZE}" -lt 500 ]; then
            echo "ERROR: Sukka index looks abnormal."
            exit 1
          fi


      # ==========================================================
      # 5. Discover Sukka List
      # ==========================================================

      - name: Discover Sukka List rules
        run: |
          set -euo pipefail

          grep -oE \
            'List/(domainset|non_ip|ip)/[^"<> ]+\.conf' \
            /tmp/sukka-stash/index.html \
            | sort -u \
            > /tmp/sukka-stash/files.txt

          TOTAL=$(wc -l < /tmp/sukka-stash/files.txt)

          DOMAINSET=$(
            grep -c '^List/domainset/' \
            /tmp/sukka-stash/files.txt || true
          )

          NON_IP=$(
            grep -c '^List/non_ip/' \
            /tmp/sukka-stash/files.txt || true
          )

          IP=$(
            grep -c '^List/ip/' \
            /tmp/sukka-stash/files.txt || true
          )

          echo ""
          echo "===================================="
          echo " Sukka List Discovery"
          echo "===================================="
          echo " domainset : ${DOMAINSET}"
          echo " non_ip    : ${NON_IP}"
          echo " ip        : ${IP}"
          echo "------------------------------------"
          echo " TOTAL     : ${TOTAL}"
          echo "===================================="

          if [ "${TOTAL}" -lt "${MIN_TOTAL_PROVIDERS}" ]; then
            echo "ERROR: Too few Sukka rule files."
            exit 1
          fi

          if [ "${DOMAINSET}" -eq 0 ] || \
             [ "${NON_IP}" -eq 0 ] || \
             [ "${IP}" -eq 0 ]; then

            echo "ERROR: Missing Sukka List category."
            exit 1
          fi


      # ==========================================================
      # 6. Download Sukka List
      # ==========================================================

      - name: Download Sukka List rules
        run: |
          set -euo pipefail

          SUCCESS=0

          while IFS= read -r FILE; do

            [ -z "${FILE}" ] && continue

            RELATIVE="${FILE#List/}"

            DEST="/tmp/sukka-stash/source/${RELATIVE}"

            mkdir -p "$(dirname "${DEST}")"

            echo "↓ ${FILE}"

            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 3 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 120 \
              "${SOURCE_BASE}/${FILE}" \
              -o "${DEST}"

            if [ ! -s "${DEST}" ]; then
              echo "ERROR: Empty source file: ${FILE}"
              exit 1
            fi

            SUCCESS=$((SUCCESS + 1))

          done < /tmp/sukka-stash/files.txt

          echo ""
          echo "Downloaded ${SUCCESS} source files."


      # ==========================================================
      # 7. Convert + Semantic Integrity Accounting
      # ==========================================================

      - name: Convert and audit Stash iOS rules
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          from collections import Counter
          import ipaddress
          import json


          SRC = Path("/tmp/sukka-stash/source")
          OUT = Path("/tmp/sukka-stash/output")
          TMP = Path("/tmp/sukka-stash")


          IOS_UNSUPPORTED = {
              "PROCESS-NAME",
              "PROCESS-PATH",
          }


          CIDR_TYPES = {
              "IP-CIDR",
              "IP-CIDR6",
          }


          DOMAIN_PROVIDER_TYPES = {
              "DOMAIN",
              "DOMAIN-SUFFIX",
              "DOMAIN-WILDCARD",
          }


          KNOWN_SUKKA_MARKERS = {
              "7h15.ru1353t.1s.m4d3.by.5ukk4w.skk.moe",
          }


          SUKKA_MARKER_SUFFIX = (
              ".m4d3.by.5ukk4w.skk.moe"
          )


          summary = {
              "source_files": 0,
              "active_files": 0,
              "deprecated_files": 0,

              "source_rules_total": 0,
              "active_source_rules": 0,
              "deprecated_source_rules": 0,

              "markers_removed": 0,
              "ios_process_filtered": 0,
              "duplicates_removed": 0,

              "output_rules": 0,
              "output_providers": 0,

              "domain_rules": 0,
              "ipcidr_rules": 0,
              "classical_rules": 0,

              "domain_providers": 0,
              "ipcidr_providers": 0,
              "classical_providers": 0,

              "no_resolve_ipcidr_providers": 0,

              "unaccounted_rules": 0,
          }


          category_stats = {
              "domainset": Counter(),
              "non_ip": Counter(),
              "ip": Counter(),
          }


          file_audit = []

          removed_markers = []
          ios_filtered = []
          skipped_files = []

          promoted_domain = []
          kept_classical_non_ip = []

          promoted_ipcidr = []
          kept_classical_ip = []

          no_resolve_ipcidr = []


          # ======================================================
          # Helpers
          # ======================================================

          def is_deprecated(text: str) -> bool:

              low = text.lower()

              return (
                  "deprecated" in low
                  or "has been merged with" in low
                  or "has been merged into" in low
              )


          def meaningful_lines(text: str):

              result = []

              for raw in text.splitlines():

                  line = raw.strip()

                  if not line:
                      continue

                  if line.startswith("#"):
                      continue

                  result.append(line)

              return result


          def normalize_domain(value: str):

              value = value.strip()

              if value.startswith("+."):
                  value = value[2:]

              value = value.lstrip(".")

              return value.lower().rstrip(".")


          def is_marker_domain(value: str):

              domain = normalize_domain(value)

              if domain in KNOWN_SUKKA_MARKERS:
                  return True

              if domain.endswith(
                  SUKKA_MARKER_SUFFIX
              ):
                  return True

              return False


          def is_sukka_marker(line: str):

              line = line.strip()

              if not line:
                  return False


              if "," not in line:

                  clean = (
                      line
                      .replace("*.", "")
                      .replace("?", "")
                  )

                  return is_marker_domain(clean)


              rule_type, remainder = (
                  line.split(",", 1)
              )


              rule_type = (
                  rule_type
                  .strip()
                  .upper()
              )


              if rule_type not in {
                  "DOMAIN",
                  "DOMAIN-SUFFIX",
                  "DOMAIN-WILDCARD",
              }:

                  return False


              value = (
                  remainder
                  .split(",", 1)[0]
                  .strip()
              )


              clean = (
                  value
                  .replace("*.", "")
                  .replace("?", "")
              )


              return is_marker_domain(clean)


          def ordered_dedupe(lines):

              seen = set()
              output = []
              removed = 0

              for line in lines:

                  if line in seen:

                      removed += 1
                      continue

                  seen.add(line)
                  output.append(line)

              return output, removed


          def write_lines(path: Path, lines):

              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              path.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8"
              )


          def new_file_record(
              category,
              src,
              source_count,
          ):

              return {
                  "source": f"{category}/{src.name}",
                  "category": category,

                  "deprecated": False,

                  "source_rules": source_count,

                  "markers_removed": 0,
                  "ios_process_filtered": 0,
                  "duplicates_removed": 0,

                  "output_rules": 0,

                  "target_behavior": None,
                  "target_path": None,

                  "no_resolve": False,

                  "accounted_rules": 0,
                  "unaccounted_rules": 0,
              }


          def finish_record(record):

              if record["deprecated"]:

                  accounted = (
                      record["source_rules"]
                  )

              else:

                  accounted = (
                      record["markers_removed"]
                      + record["ios_process_filtered"]
                      + record["duplicates_removed"]
                      + record["output_rules"]
                  )


              record["accounted_rules"] = accounted

              record["unaccounted_rules"] = (
                  record["source_rules"]
                  - accounted
              )


              if record["unaccounted_rules"] != 0:

                  raise RuntimeError(
                      "RULE CONSERVATION FAILURE: "
                      f"{record['source']} "
                      f"source={record['source_rules']} "
                      f"accounted={accounted} "
                      f"unaccounted="
                      f"{record['unaccounted_rules']}"
                  )


              file_audit.append(record)


          def process_common(
              lines,
              category,
              src,
              record,
              process_filter,
          ):

              cleaned = []


              for line in lines:

                  if is_sukka_marker(line):

                      record["markers_removed"] += 1

                      removed_markers.append(
                          f"{category}/{src.name}: {line}"
                      )

                      continue


                  if process_filter and "," in line:

                      rule_type = (
                          line
                          .split(",", 1)[0]
                          .strip()
                          .upper()
                      )


                      if rule_type in IOS_UNSUPPORTED:

                          record[
                              "ios_process_filtered"
                          ] += 1

                          ios_filtered.append(
                              f"{category}/{src.name}: {line}"
                          )

                          continue


                  cleaned.append(line)


              cleaned, removed = ordered_dedupe(
                  cleaned
              )


              record["duplicates_removed"] += removed


              return cleaned


          def register_output(
              record,
              behavior,
              path,
              output_lines,
              no_resolve=False,
          ):

              record["target_behavior"] = behavior
              record["target_path"] = str(
                  path.relative_to(OUT)
              )

              record["output_rules"] = len(
                  output_lines
              )

              record["no_resolve"] = no_resolve


              summary["output_providers"] += 1
              summary["output_rules"] += len(
                  output_lines
              )


              if behavior == "domain":

                  summary["domain_providers"] += 1

                  summary["domain_rules"] += len(
                      output_lines
                  )


              elif behavior == "ipcidr":

                  summary["ipcidr_providers"] += 1

                  summary["ipcidr_rules"] += len(
                      output_lines
                  )


              else:

                  summary[
                      "classical_providers"
                  ] += 1

                  summary["classical_rules"] += len(
                      output_lines
                  )


          def load_source(
              category,
              src,
          ):

              text = src.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )


              lines = meaningful_lines(text)

              count = len(lines)


              summary["source_files"] += 1
              summary["source_rules_total"] += count


              category_stats[category][
                  "source_files"
              ] += 1

              category_stats[category][
                  "source_rules"
              ] += count


              record = new_file_record(
                  category,
                  src,
                  count,
              )


              if is_deprecated(text):

                  record["deprecated"] = True

                  summary["deprecated_files"] += 1

                  summary[
                      "deprecated_source_rules"
                  ] += count


                  category_stats[category][
                      "deprecated_files"
                  ] += 1

                  category_stats[category][
                      "deprecated_rules"
                  ] += count


                  skipped_files.append(
                      f"DEPRECATED: "
                      f"{category}/{src.name}"
                  )


                  finish_record(record)

                  return None, record


              summary["active_files"] += 1
              summary["active_source_rules"] += count


              category_stats[category][
                  "active_files"
              ] += 1

              category_stats[category][
                  "active_rules"
              ] += count


              return lines, record


          # ======================================================
          # A. domainset
          # ======================================================

          for src in sorted(
              (SRC / "domainset").glob("*.conf")
          ):

              lines, record = load_source(
                  "domainset",
                  src,
              )


              if lines is None:
                  continue


              cleaned = process_common(
                  lines,
                  "domainset",
                  src,
                  record,
                  process_filter=False,
              )


              converted = []


              for line in cleaned:

                  value = line.strip()


                  if value.startswith("."):

                      value = (
                          "+."
                          + value[1:]
                      )


                  converted.append(value)


              converted, removed = ordered_dedupe(
                  converted
              )


              record[
                  "duplicates_removed"
              ] += removed


              if not converted:

                  skipped_files.append(
                      f"EMPTY AFTER CLEAN: "
                      f"domainset/{src.name}"
                  )

                  finish_record(record)

                  continue


              dst = (
                  OUT
                  / "domain"
                  / "domainset"
                  / f"{src.stem}.txt"
              )


              write_lines(
                  dst,
                  converted,
              )


              register_output(
                  record,
                  "domain",
                  dst,
                  converted,
              )


              promoted_domain.append(
                  f"domainset/{src.name}"
              )


              finish_record(record)


          # ======================================================
          # B. non_ip
          # ======================================================

          for src in sorted(
              (SRC / "non_ip").glob("*.conf")
          ):

              lines, record = load_source(
                  "non_ip",
                  src,
              )


              if lines is None:
                  continue


              cleaned = process_common(
                  lines,
                  "non_ip",
                  src,
                  record,
                  process_filter=True,
              )


              if not cleaned:

                  skipped_files.append(
                      f"EMPTY AFTER CLEAN: "
                      f"non_ip/{src.name}"
                  )

                  finish_record(record)

                  continue


              pure_domain = True
              converted = []


              for line in cleaned:

                  if "," not in line:

                      pure_domain = False
                      break


                  rule_type, remainder = (
                      line.split(",", 1)
                  )


                  rule_type = (
                      rule_type
                      .strip()
                      .upper()
                  )


                  if "," in remainder:

                      pure_domain = False
                      break


                  value = remainder.strip()


                  if (
                      rule_type
                      not in DOMAIN_PROVIDER_TYPES
                  ):

                      pure_domain = False
                      break


                  if not value:

                      pure_domain = False
                      break


                  if rule_type == "DOMAIN":

                      converted.append(
                          value
                      )


                  elif rule_type == "DOMAIN-SUFFIX":

                      converted.append(
                          "+."
                          + value.lstrip(".")
                      )


                  elif rule_type == "DOMAIN-WILDCARD":

                      converted.append(
                          value
                      )


              if pure_domain and converted:

                  converted, removed = ordered_dedupe(
                      converted
                  )

                  record[
                      "duplicates_removed"
                  ] += removed


                  dst = (
                      OUT
                      / "domain"
                      / "non_ip"
                      / f"{src.stem}.txt"
                  )


                  write_lines(
                      dst,
                      converted,
                  )


                  register_output(
                      record,
                      "domain",
                      dst,
                      converted,
                  )


                  promoted_domain.append(
                      f"non_ip/{src.name}"
                  )


              else:

                  dst = (
                      OUT
                      / "classical"
                      / "non_ip"
                      / f"{src.stem}.txt"
                  )


                  write_lines(
                      dst,
                      cleaned,
                  )


                  register_output(
                      record,
                      "classical",
                      dst,
                      cleaned,
                  )


                  kept_classical_non_ip.append(
                      src.stem
                  )


              finish_record(record)


          # ======================================================
          # C. ip
          # ======================================================

          for src in sorted(
              (SRC / "ip").glob("*.conf")
          ):

              lines, record = load_source(
                  "ip",
                  src,
              )


              if lines is None:
                  continue


              cleaned = process_common(
                  lines,
                  "ip",
                  src,
                  record,
                  process_filter=True,
              )


              if not cleaned:

                  skipped_files.append(
                      f"EMPTY AFTER CLEAN: "
                      f"ip/{src.name}"
                  )

                  finish_record(record)

                  continue


              pure_cidr = True
              cidrs = []
              has_no_resolve = False


              for line in cleaned:

                  if "," not in line:

                      pure_cidr = False
                      break


                  rule_type, remainder = (
                      line.split(",", 1)
                  )


                  rule_type = (
                      rule_type
                      .strip()
                      .upper()
                  )


                  if rule_type not in CIDR_TYPES:

                      pure_cidr = False
                      break


                  value = remainder.strip()


                  if value.lower().endswith(
                      ",no-resolve"
                  ):

                      has_no_resolve = True

                      value = value[
                          :-len(",no-resolve")
                      ].strip()


                  try:

                      network = ipaddress.ip_network(
                          value,
                          strict=False
                      )


                  except ValueError:

                      pure_cidr = False
                      break


                  cidrs.append(
                      str(network)
                  )


              if pure_cidr and cidrs:

                  cidrs, removed = ordered_dedupe(
                      cidrs
                  )


                  record[
                      "duplicates_removed"
                  ] += removed


                  dst = (
                      OUT
                      / "ipcidr"
                      / f"{src.stem}.txt"
                  )


                  write_lines(
                      dst,
                      cidrs,
                  )


                  register_output(
                      record,
                      "ipcidr",
                      dst,
                      cidrs,
                      no_resolve=has_no_resolve,
                  )


                  promoted_ipcidr.append(
                      src.stem
                  )


                  if has_no_resolve:

                      no_resolve_ipcidr.append(
                          src.stem
                      )


              else:

                  dst = (
                      OUT
                      / "classical"
                      / "ip"
                      / f"{src.stem}.txt"
                  )


                  write_lines(
                      dst,
                      cleaned,
                  )


                  register_output(
                      record,
                      "classical",
                      dst,
                      cleaned,
                  )


                  kept_classical_ip.append(
                      src.stem
                  )


              finish_record(record)


          # ======================================================
          # Aggregate accounting
          # ======================================================

          summary["markers_removed"] = sum(
              item["markers_removed"]
              for item in file_audit
          )


          summary["ios_process_filtered"] = sum(
              item["ios_process_filtered"]
              for item in file_audit
          )


          summary["duplicates_removed"] = sum(
              item["duplicates_removed"]
              for item in file_audit
          )


          summary[
              "no_resolve_ipcidr_providers"
          ] = len(no_resolve_ipcidr)


          accounted = (
              summary["deprecated_source_rules"]
              + summary["markers_removed"]
              + summary["ios_process_filtered"]
              + summary["duplicates_removed"]
              + summary["output_rules"]
          )


          summary["unaccounted_rules"] = (
              summary["source_rules_total"]
              - accounted
          )


          if summary["unaccounted_rules"] != 0:

              raise RuntimeError(
                  "GLOBAL RULE CONSERVATION FAILURE: "
                  f"source="
                  f"{summary['source_rules_total']} "
                  f"accounted={accounted} "
                  f"unaccounted="
                  f"{summary['unaccounted_rules']}"
              )


          for category in category_stats:

              records = [
                  item
                  for item in file_audit
                  if item["category"] == category
              ]


              cs = category_stats[category]


              cs["markers_removed"] = sum(
                  item["markers_removed"]
                  for item in records
              )


              cs["ios_process_filtered"] = sum(
                  item["ios_process_filtered"]
                  for item in records
              )


              cs["duplicates_removed"] = sum(
                  item["duplicates_removed"]
                  for item in records
              )


              cs["output_rules"] = sum(
                  item["output_rules"]
                  for item in records
              )


              cs["unaccounted_rules"] = sum(
                  item["unaccounted_rules"]
                  for item in records
              )


          # ======================================================
          # Save auxiliary reports
          # ======================================================

          def save_lines(name, items):

              path = TMP / name

              if items:

                  path.write_text(
                      "\n".join(items) + "\n",
                      encoding="utf-8"
                  )

              elif path.exists():

                  path.unlink()


          save_lines(
              "removed-markers.txt",
              removed_markers
          )


          save_lines(
              "ios-filtered.txt",
              ios_filtered
          )


          save_lines(
              "promoted-domain.txt",
              promoted_domain
          )


          save_lines(
              "classical-non-ip.txt",
              kept_classical_non_ip
          )


          save_lines(
              "promoted-ipcidr.txt",
              promoted_ipcidr
          )


          save_lines(
              "classical-ip.txt",
              kept_classical_ip
          )


          save_lines(
              "no-resolve-ipcidr.txt",
              no_resolve_ipcidr
          )


          save_lines(
              "skipped.txt",
              skipped_files
          )


          # ======================================================
          # Semantic audit JSON
          # ======================================================

          audit = {
              "schema_version": 1,

              "generator": (
                  "Sukka List -> Stash "
                  "V1.4.2.1 Semantic Integrity Bugfix Final"
              ),

              "upstream": (
                  "https://ruleset.skk.moe/"
              ),

              "summary": summary,

              "categories": {
                  name: dict(stats)
                  for name, stats
                  in category_stats.items()
              },

              "files": file_audit,
          }


          (TMP / "SEMANTIC_AUDIT.json").write_text(
              json.dumps(
                  audit,
                  ensure_ascii=False,
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8"
          )


          # ======================================================
          # Semantic audit Markdown
          # ======================================================

          s = summary


          markdown = f"""# Semantic Integrity Audit

          Generator:

          `Sukka List -> Stash V1.4.2.1 Semantic Integrity Bugfix Final`

          ## Global Rule Conservation

          | Metric | Count |
          |---|---:|
          | Source files | {s['source_files']} |
          | Active files | {s['active_files']} |
          | Deprecated files | {s['deprecated_files']} |
          | Source rules total | {s['source_rules_total']} |
          | Deprecated source rules | {s['deprecated_source_rules']} |
          | Sukka Markers removed | {s['markers_removed']} |
          | iOS PROCESS rules filtered | {s['ios_process_filtered']} |
          | Duplicates removed | {s['duplicates_removed']} |
          | Final output rules | {s['output_rules']} |
          | Unaccounted rules | {s['unaccounted_rules']} |

          ## Output

