
name: Sukka List to Stash V1.2 iOS Final

on:
  workflow_dispatch:

  schedule:
    # 每天 UTC 06:20 自动执行一次
    - cron: "20 6 * * *"

permissions:
  contents: write

concurrency:
  group: sukka-stash-ios-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SOURCE_BASE: https://ruleset.skk.moe
      MIN_TOTAL_RULES: 20

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # 2. Configure Git
      # ==========================================================

      - name: Configure Git
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


      # ==========================================================
      # 3. Prepare workspace
      # ==========================================================

      - name: Prepare workspace
        run: |
          set -euo pipefail

          rm -rf /tmp/sukka-stash

          mkdir -p /tmp/sukka-stash/source/domainset
          mkdir -p /tmp/sukka-stash/source/non_ip
          mkdir -p /tmp/sukka-stash/source/ip

          mkdir -p /tmp/sukka-stash/output/domain
          mkdir -p /tmp/sukka-stash/output/non_ip
          mkdir -p /tmp/sukka-stash/output/ip


      # ==========================================================
      # 4. Fetch Sukka index
      # ==========================================================

      - name: Fetch Sukka index
        run: |
          set -euo pipefail

          echo "Fetching Sukka index..."

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 60 \
            "${SOURCE_BASE}/" \
            -o /tmp/sukka-stash/index.html

          if [ ! -s /tmp/sukka-stash/index.html ]; then
            echo "ERROR: Sukka index is empty."
            exit 1
          fi

          SIZE=$(wc -c < /tmp/sukka-stash/index.html)

          echo "Index size: ${SIZE} bytes"

          if [ "${SIZE}" -lt 500 ]; then
            echo "ERROR: Sukka index looks abnormal."
            exit 1
          fi


      # ==========================================================
      # 5. Discover List rules
      # ==========================================================

      - name: Discover Sukka List rules
        run: |
          set -euo pipefail

          grep -oE \
            'List/(domainset|non_ip|ip)/[^"<> ]+\.conf' \
            /tmp/sukka-stash/index.html \
            | sort -u \
            > /tmp/sukka-stash/files.txt

          TOTAL=$(wc -l < /tmp/sukka-stash/files.txt)

          DOMAINSET=$(
            grep -c '^List/domainset/' \
            /tmp/sukka-stash/files.txt || true
          )

          NON_IP=$(
            grep -c '^List/non_ip/' \
            /tmp/sukka-stash/files.txt || true
          )

          IP=$(
            grep -c '^List/ip/' \
            /tmp/sukka-stash/files.txt || true
          )

          echo ""
          echo "===================================="
          echo " Sukka List Rules"
          echo "===================================="
          echo " domainset : ${DOMAINSET}"
          echo " non_ip    : ${NON_IP}"
          echo " ip        : ${IP}"
          echo "------------------------------------"
          echo " TOTAL     : ${TOTAL}"
          echo "===================================="

          if [ "${TOTAL}" -lt "${MIN_TOTAL_RULES}" ]; then
            echo "ERROR: Too few rules discovered."
            exit 1
          fi

          if [ "${DOMAINSET}" -eq 0 ] || \
             [ "${NON_IP}" -eq 0 ] || \
             [ "${IP}" -eq 0 ]; then

            echo "ERROR: Missing Sukka List category."
            exit 1
          fi


      # ==========================================================
      # 6. Download List rules
      # ==========================================================

      - name: Download Sukka List rules
        run: |
          set -euo pipefail

          SUCCESS=0

          while IFS= read -r FILE; do

            [ -z "${FILE}" ] && continue

            RELATIVE="${FILE#List/}"

            DEST="/tmp/sukka-stash/source/${RELATIVE}"

            mkdir -p "$(dirname "${DEST}")"

            echo "↓ ${FILE}"

            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 3 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 120 \
              "${SOURCE_BASE}/${FILE}" \
              -o "${DEST}"

            if [ ! -s "${DEST}" ]; then
              echo "ERROR: Empty source file:"
              echo "${FILE}"
              exit 1
            fi

            SUCCESS=$((SUCCESS + 1))

          done < /tmp/sukka-stash/files.txt

          echo ""
          echo "Downloaded ${SUCCESS} source files."


      # ==========================================================
      # 7. Convert Sukka List -> Stash iOS
      # ==========================================================

      - name: Convert List rules to Stash iOS
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          SRC = Path("/tmp/sukka-stash/source")
          OUT = Path("/tmp/sukka-stash/output")

          IOS_UNSUPPORTED_TYPES = {
              "PROCESS-NAME",
              "PROCESS-PATH",
          }

          skipped_files = []
          ios_filtered = []

          generated = 0
          filtered_count = 0


          def is_deprecated(text: str) -> bool:
              lower = text.lower()

              return (
                  "deprecated" in lower
                  or "has been merged with" in lower
                  or "has been merged into" in lower
              )


          # ======================================================
          # domainset -> Stash behavior: domain
          #
          # Sukka:
          # .example.com
          #
          # Stash:
          # +.example.com
          # ======================================================

          for src in sorted(
              (SRC / "domainset").glob("*.conf")
          ):

              text = src.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              if is_deprecated(text):

                  skipped_files.append(
                      f"DEPRECATED: domainset/{src.name}"
                  )

                  continue


              output = []


              for raw in text.splitlines():

                  line = raw.strip()

                  if not line:
                      continue

                  if line.startswith("#"):
                      continue


                  if line.startswith("."):
                      line = "+." + line[1:]


                  if line not in output:
                      output.append(line)


              if not output:

                  skipped_files.append(
                      f"EMPTY: domainset/{src.name}"
                  )

                  continue


              dst = (
                  OUT
                  / "domain"
                  / f"{src.stem}.txt"
              )


              dst.write_text(
                  "\n".join(output) + "\n",
                  encoding="utf-8"
              )

              generated += 1


          # ======================================================
          # classical converter
          # ======================================================

          def convert_classical(
              src: Path,
              dst: Path,
              category: str
          ):

              global generated
              global filtered_count


              text = src.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )


              if is_deprecated(text):

                  skipped_files.append(
                      f"DEPRECATED: {category}/{src.name}"
                  )

                  return


              output = []


              for raw in text.splitlines():

                  line = raw.strip()

                  if not line:
                      continue

                  if line.startswith("#"):
                      continue


                  # ==============================================
                  # iOS process rule filter
                  # ==============================================

                  if "," in line:

                      rule_type = (
                          line.split(",", 1)[0]
                          .strip()
                          .upper()
                      )

                      if rule_type in IOS_UNSUPPORTED_TYPES:

                          ios_filtered.append(
                              f"{category}/{src.name}: {line}"
                          )

                          filtered_count += 1

                          continue


                  # ==============================================
                  # 其余 Sukka classical 规则尽量原样保留
                  #
                  # 包括：
                  # DOMAIN-*
                  # IP-CIDR
                  # IP-CIDR6
                  # IP-ASN
                  # GEOIP
                  # URL-REGEX
                  # USER-AGENT
                  # NETWORK
                  # PROTOCOL
                  # AND / OR / NOT
                  # no-resolve
                  # ==============================================

                  if line not in output:
                      output.append(line)


              if not output:

                  skipped_files.append(
                      f"EMPTY AFTER IOS FILTER: "
                      f"{category}/{src.name}"
                  )

                  return


              dst.write_text(
                  "\n".join(output) + "\n",
                  encoding="utf-8"
              )

              generated += 1


          # ======================================================
          # non_ip
          # ======================================================

          for src in sorted(
              (SRC / "non_ip").glob("*.conf")
          ):

              dst = (
                  OUT
                  / "non_ip"
                  / f"{src.stem}.txt"
              )

              convert_classical(
                  src,
                  dst,
                  "non_ip"
              )


          # ======================================================
          # ip
          # ======================================================

          for src in sorted(
              (SRC / "ip").glob("*.conf")
          ):

              dst = (
                  OUT
                  / "ip"
                  / f"{src.stem}.txt"
              )

              convert_classical(
                  src,
                  dst,
                  "ip"
              )


          # ======================================================
          # Reports
          # ======================================================

          print("")
          print("====================================")
          print(" Sukka -> Stash iOS Conversion")
          print("====================================")
          print(f" Generated     : {generated}")
          print(f" iOS filtered  : {filtered_count}")
          print(f" Skipped files : {len(skipped_files)}")
          print("====================================")


          if skipped_files:

              Path(
                  "/tmp/sukka-stash/skipped.txt"
              ).write_text(
                  "\n".join(skipped_files),
                  encoding="utf-8"
              )


          if ios_filtered:

              Path(
                  "/tmp/sukka-stash/ios-filtered.txt"
              ).write_text(
                  "\n".join(ios_filtered),
                  encoding="utf-8"
              )


              print("")
              print("Filtered iOS process rules:")

              for item in ios_filtered[:50]:
                  print(f"  {item}")

              if len(ios_filtered) > 50:
                  print("  ...")


          if generated == 0:

              raise RuntimeError(
                  "No Stash iOS rule sets generated."
              )

          PY


      # ==========================================================
      # 8. Validate output
      # ==========================================================

      - name: Validate Stash output
        run: |
          set -euo pipefail

          DOMAIN=$(
            find /tmp/sukka-stash/output/domain \
              -type f \
              -name "*.txt" \
              | wc -l
          )

          NON_IP=$(
            find /tmp/sukka-stash/output/non_ip \
              -type f \
              -name "*.txt" \
              | wc -l
          )

          IP=$(
            find /tmp/sukka-stash/output/ip \
              -type f \
              -name "*.txt" \
              | wc -l
          )

          TOTAL=$((DOMAIN + NON_IP + IP))


          echo ""
          echo "===================================="
          echo " Stash iOS Rule Sets"
          echo "===================================="
          echo " domain : ${DOMAIN}"
          echo " non_ip : ${NON_IP}"
          echo " ip     : ${IP}"
          echo "------------------------------------"
          echo " TOTAL  : ${TOTAL}"
          echo "===================================="


          if [ "${TOTAL}" -lt "${MIN_TOTAL_RULES}" ]; then
            echo "ERROR: Too few Stash iOS rule sets."
            exit 1
          fi


          if [ "${DOMAIN}" -eq 0 ] || \
             [ "${NON_IP}" -eq 0 ] || \
             [ "${IP}" -eq 0 ]; then

            echo "ERROR: One or more categories are empty."
            exit 1
          fi


          EMPTY=0


          while IFS= read -r FILE; do

            if [ ! -s "${FILE}" ]; then

              echo "ERROR: Empty generated file:"
              echo "${FILE}"

              EMPTY=$((EMPTY + 1))

            fi

          done < <(
            find /tmp/sukka-stash/output \
              -type f \
              -name "*.txt"
          )


          if [ "${EMPTY}" -ne 0 ]; then
            exit 1
          fi


      # ==========================================================
      # 9. Tolerant Stash iOS audit
      #
      # 不维护完整规则类型白名单
      # ==========================================================

      - name: Validate Stash iOS rules
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          ROOT = Path("/tmp/sukka-stash/output")

          IOS_FORBIDDEN = {
              "PROCESS-NAME",
              "PROCESS-PATH",
          }

          errors = []
          checked = 0
          types = {}


          # ======================================================
          # domain behavior
          # ======================================================

          for file in sorted(
              (ROOT / "domain").glob("*.txt")
          ):

              for lineno, raw in enumerate(
                  file.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  ).splitlines(),
                  1
              ):

                  line = raw.strip()

                  if not line:
                      continue

                  if line.startswith("#"):
                      continue


                  checked += 1


                  if "," in line:

                      errors.append(
                          f"{file}:{lineno}: "
                          f"classical syntax found "
                          f"in domain provider: {line}"
                      )


          # ======================================================
          # classical providers
          # ======================================================

          for folder in ("non_ip", "ip"):

              for file in sorted(
                  (ROOT / folder).glob("*.txt")
              ):

                  for lineno, raw in enumerate(
                      file.read_text(
                          encoding="utf-8",
                          errors="ignore"
                      ).splitlines(),
                      1
                  ):

                      line = raw.strip()

                      if not line:
                          continue

                      if line.startswith("#"):
                          continue


                      checked += 1


                      if "," not in line:

                          errors.append(
                              f"{file}:{lineno}: "
                              f"invalid classical rule: "
                              f"{line}"
                          )

                          continue


                      rule_type, remainder = (
                          line.split(",", 1)
                      )

                      rule_type = (
                          rule_type
                          .strip()
                          .upper()
                      )

                      remainder = remainder.strip()


                      if not rule_type:

                          errors.append(
                              f"{file}:{lineno}: "
                              f"empty rule type"
                          )

                          continue


                      if not remainder:

                          errors.append(
                              f"{file}:{lineno}: "
                              f"empty rule value"
                          )

                          continue


                      types[rule_type] = (
                          types.get(rule_type, 0) + 1
                      )


                      if rule_type in IOS_FORBIDDEN:

                          errors.append(
                              f"{file}:{lineno}: "
                              f"iOS process rule remained: "
                              f"{line}"
                          )


          print("")
          print("====================================")
          print(" Stash iOS Rule Audit")
          print("====================================")
          print(f" Checked : {checked}")
          print(f" Errors  : {len(errors)}")
          print("------------------------------------")
          print("Detected rule types:")


          for rule_type in sorted(types):

              print(
                  f"  {rule_type:<24} "
                  f"{types[rule_type]}"
              )


          print("====================================")


          if errors:

              print("")
              print("Validation errors:")


              for item in errors[:100]:
                  print(f"  {item}")


              if len(errors) > 100:

                  print(
                      f"  ... and "
                      f"{len(errors) - 100} more"
                  )


              raise RuntimeError(
                  f"{len(errors)} Stash iOS "
                  f"validation errors found"
              )


          print("")
          print(
              "Stash iOS rule audit passed."
          )

          PY


      # ==========================================================
      # 10. Generate conversion report
      # ==========================================================

      - name: Generate conversion report
        run: |
          set -euo pipefail

          {
            echo "# Sukka -> Stash iOS Conversion Report"
            echo ""
            echo "Source:"
            echo ""
            echo "https://ruleset.skk.moe/"
            echo ""

            echo "## Mapping"
            echo ""
            echo "- List/domainset -> domain/"
            echo "- List/non_ip -> non_ip/"
            echo "- List/ip -> ip/"
            echo ""

            echo "## iOS filtered rules"
            echo ""

            if [ -s /tmp/sukka-stash/ios-filtered.txt ]; then

              echo '```text'

              cat /tmp/sukka-stash/ios-filtered.txt

              echo '```'

            else

              echo "None"

            fi


            echo ""
            echo "## Skipped source files"
            echo ""

            if [ -s /tmp/sukka-stash/skipped.txt ]; then

              sed 's/^/- /' \
                /tmp/sukka-stash/skipped.txt

            else

              echo "- None"

            fi


          } > /tmp/sukka-stash/REPORT.md


      # ==========================================================
      # 11. Generate new checksum
      # ==========================================================

      - name: Generate new checksum
        run: |
          set -euo pipefail

          cd /tmp/sukka-stash/output

          find domain non_ip ip \
            -type f \
            -name "*.txt" \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > /tmp/sukka-stash/new.sha256


          sha256sum \
            /tmp/sukka-stash/new.sha256 \
            | awk '{print $1}' \
            > /tmp/sukka-stash/new.master


          echo "New rule version:"
          cat /tmp/sukka-stash/new.master


      # ==========================================================
      # 12. Generate current checksum
      # ==========================================================

      - name: Generate current checksum
        run: |
          set -euo pipefail

          if [ -d domain ] && \
             [ -d non_ip ] && \
             [ -d ip ] && \
             find domain non_ip ip \
               -type f \
               -name "*.txt" \
               | grep -q .; then


            find domain non_ip ip \
              -type f \
              -name "*.txt" \
              -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > /tmp/sukka-stash/current.sha256


            sha256sum \
              /tmp/sukka-stash/current.sha256 \
              | awk '{print $1}' \
              > /tmp/sukka-stash/current.master


          else

            echo "none" \
              > /tmp/sukka-stash/current.master

          fi


          echo "Current rule version:"
          cat /tmp/sukka-stash/current.master


      # ==========================================================
      # 13. Compare
      # ==========================================================

      - name: Compare rule versions
        id: compare
        run: |
          set -euo pipefail

          NEW=$(cat /tmp/sukka-stash/new.master)
          OLD=$(cat /tmp/sukka-stash/current.master)


          echo "Old: ${OLD}"
          echo "New: ${NEW}"


          if [ "${NEW}" = "${OLD}" ]; then

            echo "changed=false" \
              >> "$GITHUB_OUTPUT"

            echo "Rules already up to date."

          else

            echo "changed=true" \
              >> "$GITHUB_OUTPUT"

            echo "New Stash iOS rules detected."

          fi


      # ==========================================================
      # 14. No update
      # ==========================================================

      - name: No update required
        if: steps.compare.outputs.changed == 'false'
        run: |
          echo ""
          echo "===================================="
          echo " Sukka -> Stash V1.2 iOS"
          echo "===================================="
          echo " STATUS : UP TO DATE"
          echo " COMMIT : NO"
          echo "===================================="


      # ==========================================================
      # 15. Replace rules
      # ==========================================================

      - name: Replace Stash rules
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail


          rm -rf domain.new
          rm -rf non_ip.new
          rm -rf ip.new


          cp -a \
            /tmp/sukka-stash/output/domain \
            domain.new


          cp -a \
            /tmp/sukka-stash/output/non_ip \
            non_ip.new


          cp -a \
            /tmp/sukka-stash/output/ip \
            ip.new


          DOMAIN_COUNT=$(
            find domain.new \
              -type f \
              -name "*.txt" \
              | wc -l
          )


          NON_IP_COUNT=$(
            find non_ip.new \
              -type f \
              -name "*.txt" \
              | wc -l
          )


          IP_COUNT=$(
            find ip.new \
              -type f \
              -name "*.txt" \
              | wc -l
          )


          TOTAL=$((DOMAIN_COUNT + NON_IP_COUNT + IP_COUNT))


          echo ""
          echo "===================================="
          echo " New Stash iOS Rules"
          echo "===================================="
          echo " domain : ${DOMAIN_COUNT}"
          echo " non_ip : ${NON_IP_COUNT}"
          echo " ip     : ${IP_COUNT}"
          echo "------------------------------------"
          echo " TOTAL  : ${TOTAL}"
          echo "===================================="


          if [ "${TOTAL}" -lt "${MIN_TOTAL_RULES}" ]; then

            echo "ERROR:"
            echo "Pre-replacement validation failed."

            rm -rf \
              domain.new \
              non_ip.new \
              ip.new

            exit 1
          fi


          if [ "${DOMAIN_COUNT}" -eq 0 ] || \
             [ "${NON_IP_COUNT}" -eq 0 ] || \
             [ "${IP_COUNT}" -eq 0 ]; then

            echo "ERROR:"
            echo "One or more rule categories are empty."

            rm -rf \
              domain.new \
              non_ip.new \
              ip.new

            exit 1
          fi


          rm -rf \
            domain \
            non_ip \
            ip


          mv domain.new domain
          mv non_ip.new non_ip
          mv ip.new ip


          echo ""
          echo "Stash iOS rules replaced successfully."


      # ==========================================================
      # 16. Save metadata
      # ==========================================================

      - name: Save metadata
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail


          cp \
            /tmp/sukka-stash/new.sha256 \
            RULES_SHA256SUMS.txt


          cp \
            /tmp/sukka-stash/new.master \
            RULES_VERSION.sha256


          cp \
            /tmp/sukka-stash/REPORT.md \
            CONVERSION_REPORT.md


      # ==========================================================
      # 17. Update README
      # ==========================================================

      - name: Update README
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail


          DOMAIN=$(
            find domain \
              -type f \
              -name "*.txt" \
              | wc -l
          )


          NON_IP=$(
            find non_ip \
              -type f \
              -name "*.txt" \
              | wc -l
          )


          IP=$(
            find ip \
              -type f \
              -name "*.txt" \
              | wc -l
          )


          TOTAL=$((DOMAIN + NON_IP + IP))


          FILTERED=$(
            if [ -s /tmp/sukka-stash/ios-filtered.txt ]; then
              wc -l < /tmp/sukka-stash/ios-filtered.txt
            else
              echo 0
            fi
          )


          VERSION=$(cat RULES_VERSION.sha256)


          cat > README.md <<EOF
          # Sukka Rules for Stash iOS

          自动将 Sukka Ruleset Server 的通用 List 转换为 iOS Stash 专用 Rule Provider。

          ## Upstream

          https://ruleset.skk.moe/

          ## Mapping

          \`\`\`text
          List/domainset -> domain/
          List/non_ip    -> non_ip/
          List/ip        -> ip/
          \`\`\`

          ## Provider Type

          | Directory | behavior | format |
          |---|---|---|
          | domain | domain | text |
          | non_ip | classical | text |
          | ip | classical | text |

          ## iOS Optimization

          自动过滤：

          \`\`\`text
          PROCESS-NAME
          PROCESS-PATH
          \`\`\`

          Filtered Rules:

          \`\`\`
          ${FILTERED}
          \`\`\`

          ## Rule Count

          | Type | Count |
          |---|---:|
          | domain | ${DOMAIN} |
          | non_ip | ${NON_IP} |
          | ip | ${IP} |
          | Total | ${TOTAL} |

          ## Version

          \`\`\`
          ${VERSION}
          \`\`\`

          ## Raw URL Examples

          \`\`\`text
          https://raw.githubusercontent.com/locksherneo/stash-sukka-rules/main/domain/apple_cdn.txt

          https://raw.githubusercontent.com/locksherneo/stash-sukka-rules/main/non_ip/ai.txt

          https://raw.githubusercontent.com/locksherneo/stash-sukka-rules/main/ip/telegram.txt
          \`\`\`

          ## Stash Example

          \`\`\`yaml
          rule-providers:

            sukka-apple-cdn:
              type: http
              behavior: domain
              format: text
              url: https://raw.githubusercontent.com/locksherneo/stash-sukka-rules/main/domain/apple_cdn.txt
              interval: 86400

            sukka-ai:
              type: http
              behavior: classical
              format: text
              url: https://raw.githubusercontent.com/locksherneo/stash-sukka-rules/main/non_ip/ai.txt
              interval: 86400

            sukka-ai-ip:
              type: http
              behavior: classical
              format: text
              url: https://raw.githubusercontent.com/locksherneo/stash-sukka-rules/main/ip/ai.txt
              interval: 86400

          rules:

            - RULE-SET,sukka-ai,AI
            - RULE-SET,sukka-ai-ip,AI
            - RULE-SET,sukka-apple-cdn,DIRECT
            - MATCH,Proxy
          \`\`\`

          ## Features

          - 每 24 小时自动同步
          - 使用 Sukka 通用 List
          - iOS 自动过滤 PROCESS-NAME / PROCESS-PATH
          - domainset 转 Stash domain provider
          - non_ip 保留 classical
          - ip 保留 classical
          - 保留 no-resolve
          - 保留 IP-ASN
          - 保留 AND / OR / NOT
          - 不维护容易过时的规则类型白名单
          - 自动跳过 Deprecated / 空规则
          - SHA256 校验
          - 无变化不 Commit
          - 自动生成转换报告

          ---

          Generated by Sukka List -> Stash V1.2 iOS Final.
          EOF


      # ==========================================================
      # 18. Final validation
      # ==========================================================

      - name: Final validation
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail


          DOMAIN=$(
            find domain \
              -type f \
              -name "*.txt" \
              | wc -l
          )


          NON_IP=$(
            find non_ip \
              -type f \
              -name "*.txt" \
              | wc -l
          )


          IP=$(
            find ip \
              -type f \
              -name "*.txt" \
              | wc -l
          )


          TOTAL=$((DOMAIN + NON_IP + IP))


          echo ""
          echo "===================================="
          echo " Final Validation"
          echo "===================================="
          echo " domain : ${DOMAIN}"
          echo " non_ip : ${NON_IP}"
          echo " ip     : ${IP}"
          echo "------------------------------------"
          echo " TOTAL  : ${TOTAL}"
          echo "===================================="


          if [ "${TOTAL}" -lt "${MIN_TOTAL_RULES}" ]; then

            echo "ERROR:"
            echo "Final rule count too low."

            exit 1
          fi


          if [ ! -s RULES_SHA256SUMS.txt ]; then

            echo "ERROR:"
            echo "RULES_SHA256SUMS.txt missing."

            exit 1
          fi


          if [ ! -s RULES_VERSION.sha256 ]; then

            echo "ERROR:"
            echo "RULES_VERSION.sha256 missing."

            exit 1
          fi


          if [ ! -s CONVERSION_REPORT.md ]; then

            echo "ERROR:"
            echo "CONVERSION_REPORT.md missing."

            exit 1
          fi


          # ======================================================
          # 最终确认没有 iOS PROCESS 规则残留
          # ======================================================

          if grep -RIE \
            '^(PROCESS-NAME|PROCESS-PATH),' \
            non_ip ip \
            --include="*.txt"; then

            echo "ERROR:"
            echo "iOS-incompatible process rules remain."

            exit 1
          fi


          echo ""
          echo "Final validation passed."


      # ==========================================================
      # 19. Commit
      # ==========================================================

      - name: Commit changes
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git add -A


          if git diff \
            --cached \
            --quiet; then

            echo "No effective changes."

            exit 0
          fi


          git commit \
            -m "chore: sync Sukka List rules for Stash iOS"


          git push


      # ==========================================================
      # 20. Completed
      # ==========================================================

      - name: Completed
        run: |
          echo ""
          echo "===================================="
          echo " Sukka List -> Stash V1.2 iOS"
          echo "===================================="
          echo " SOURCE : Sukka List"
          echo " FORMAT : Stash iOS"
          echo " SYNC   : 24 hours"
          echo " STATUS : SUCCESS"
          echo "===================================="
