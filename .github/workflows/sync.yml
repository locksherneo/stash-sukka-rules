      - name: Validate Stash semantics
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import ipaddress


          ROOT = Path(
              "/tmp/sukka-stash/output"
          )


          errors = []


          for folder in (
              ROOT / "domain" / "domainset",
              ROOT / "domain" / "non_ip",
          ):

              for file in folder.glob("*.txt"):

                  for lineno, raw in enumerate(
                      file.read_text(
                          encoding="utf-8",
                          errors="ignore"
                      ).splitlines(),
                      1
                  ):

                      line = raw.strip()


                      if not line:
                          continue


                      if "," in line:

                          errors.append(
                              f"{file}:{lineno}: "
                              f"classical syntax in "
                              f"domain provider"
                          )


          for file in (
              ROOT / "ipcidr"
          ).glob("*.txt"):

              for lineno, raw in enumerate(
                  file.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  ).splitlines(),
                  1
              ):

                  line = raw.strip()


                  if not line:
                      continue


                  if "," in line:

                      errors.append(
                          f"{file}:{lineno}: "
                          f"classical syntax in "
                          f"ipcidr provider"
                      )

                      continue


                  try:

                      ipaddress.ip_network(
                          line,
                          strict=False
                      )


                  except ValueError:

                      errors.append(
                          f"{file}:{lineno}: "
                          f"invalid CIDR: {line}"
                      )


          for folder in (
              ROOT / "classical" / "non_ip",
              ROOT / "classical" / "ip",
          ):

              for file in folder.glob("*.txt"):

                  for lineno, raw in enumerate(
                      file.read_text(
                          encoding="utf-8",
                          errors="ignore"
                      ).splitlines(),
                      1
                  ):

                      line = raw.strip()


                      if not line:
                          continue


                      if "," not in line:

                          errors.append(
                              f"{file}:{lineno}: "
                              f"invalid classical rule"
                          )

                          continue


                      rule_type = (
                          line
                          .split(",", 1)[0]
                          .strip()
                          .upper()
                      )


                      if rule_type in {
                          "PROCESS-NAME",
                          "PROCESS-PATH",
                      }:

                          errors.append(
                              f"{file}:{lineno}: "
                              f"iOS PROCESS rule remained"
                          )


          if errors:

              print("")

              for item in errors[:100]:
                  print(item)


              raise RuntimeError(
                  f"{len(errors)} Stash semantic "
                  f"errors found."
              )


          print(
              "Stash semantic validation passed."
          )

          PY


