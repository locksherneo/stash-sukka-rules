name: Sukka List to Stash V1.5 iOS Hybrid MRS Semantic Final

on:
  workflow_dispatch:
    inputs:
      build_mrs:
        description: Build verified domain/ipcidr MRS rule sets
        required: true
        default: true
        type: boolean
      build_ios_lite:
        description: Build iOS Lite without URL-REGEX or SCRIPT rules
        required: true
        default: true
        type: boolean
      allow_large_drop:
        description: Allow an exceptional upstream rule-count reduction
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "20 6 * * *"

permissions:
  contents: write

concurrency:
  group: sukka-stash-ios-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SOURCE_BASE: https://ruleset.skk.moe
      MIHOMO_TAG: v1.19.30
      DOWNLOAD_WORKERS: "8"
      MIN_TOTAL_SOURCE_FILES: "20"
      MIN_TOTAL_PROVIDERS: "20"
      MIN_TOTAL_RULES: "1000"
      MAX_RULE_DROP_PERCENT: "25"
      PROVIDER_INTERVAL: "86400"
      LITE_EXCLUDED_TYPES: URL-REGEX,SCRIPT
      REQUIRED_SOURCES: domainset/reject.conf,non_ip/ai.conf,ip/china_ip.conf,ip/telegram.conf
      BUILD_MRS: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_mrs == 'true' }}
      BUILD_IOS_LITE: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_ios_lite == 'true' }}
      ALLOW_LARGE_DROP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.allow_large_drop == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Synchronize branch before generation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          git merge --ff-only "origin/$GITHUB_REF_NAME"
          printf 'Validated base commit: %s\n' "$(git rev-parse HEAD)"

      - name: Prepare isolated staging directory
        id: staging
        shell: bash
        run: |
          set -euo pipefail
          work_root="$(mktemp -d "$RUNNER_TEMP/sukka-stash-v1.5.XXXXXXXX")"
          mkdir -p "$work_root/source/domainset" \
            "$work_root/source/non_ip" \
            "$work_root/source/ip" \
            "$work_root/output"
          printf 'WORK_ROOT=%s\n' "$work_root" >> "$GITHUB_ENV"
          printf 'work_root=%s\n' "$work_root" >> "$GITHUB_OUTPUT"

      - name: Discover and download Sukka source rules concurrently
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from html import unescape
          from pathlib import Path
          from urllib.parse import quote
          import os
          import re
          import time
          import urllib.error
          import urllib.request

          root = Path(os.environ["WORK_ROOT"])
          source_base = os.environ["SOURCE_BASE"].rstrip("/")
          minimum = int(os.environ["MIN_TOTAL_SOURCE_FILES"])
          workers = max(1, min(16, int(os.environ["DOWNLOAD_WORKERS"])))
          user_agent = "Sukka-Stash-iOS-Sync/1.5 (+GitHub Actions)"

          def fetch(url: str, *, attempts: int = 5) -> bytes:
              last_error = None
              for attempt in range(1, attempts + 1):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={"User-Agent": user_agent, "Accept": "*/*"},
                      )
                      with urllib.request.urlopen(request, timeout=60) as response:
                          body = response.read()
                      if not body:
                          raise ValueError("upstream returned an empty response")
                      return body
                  except (OSError, ValueError, urllib.error.URLError) as error:
                      last_error = error
                      if attempt < attempts:
                          time.sleep(min(attempt * 2, 8))
              raise RuntimeError(f"{url}: {last_error}") from last_error

          index = fetch(source_base + "/")
          if len(index) < 500:
              raise SystemExit("Sukka index is unexpectedly small")

          text = unescape(index.decode("utf-8", errors="strict"))
          pattern = re.compile(
              r"List/(?:domainset|non_ip|ip)/[A-Za-z0-9_.@+-]+[.]conf"
          )
          discovered = sorted({match.group(0) for match in pattern.finditer(text)})
          categories = Counter(path.split("/")[1] for path in discovered)

          if len(discovered) < minimum:
              raise SystemExit(
                  f"Only {len(discovered)} source files discovered; minimum={minimum}"
              )
          if any(categories[name] == 0 for name in ("domainset", "non_ip", "ip")):
              raise SystemExit(f"An upstream source category is empty: {dict(categories)}")

          required = {
              item.strip()
              for item in os.getenv("REQUIRED_SOURCES", "").split(",")
              if item.strip()
          }
          present = {path.removeprefix("List/") for path in discovered}
          missing = sorted(required - present)
          if missing:
              raise SystemExit(f"Critical Sukka source files are missing: {missing}")

          (root / "files.txt").write_text(
              "\n".join(discovered) + "\n",
              encoding="utf-8",
          )

          def download(relative: str) -> tuple[str, int]:
              safe_relative = quote(relative, safe="/@+.-_")
              payload = fetch(source_base + "/" + safe_relative)
              destination = root / "source" / relative.removeprefix("List/")
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(payload)
              return relative, len(payload)

          failures = []
          with ThreadPoolExecutor(max_workers=workers) as executor:
              futures = {
                  executor.submit(download, relative): relative
                  for relative in discovered
              }
              for future in as_completed(futures):
                  relative = futures[future]
                  try:
                      name, size = future.result()
                      print(f"Downloaded {name}: {size:,} bytes")
                  except Exception as error:
                      failures.append(f"{relative}: {error}")

          if failures:
              raise SystemExit(
                  "One or more upstream downloads failed:\n" + "\n".join(sorted(failures))
              )
          print(
              "Sukka discovery complete: "
              f"files={len(discovered)}, categories={dict(categories)}, workers={workers}"
          )
          PY

      - name: Install checksum-verified pinned Mihomo binary
        if: env.BUILD_MRS == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import gzip
          import hashlib
          import json
          import os
          import shutil
          import stat
          import urllib.error
          import urllib.request

          root = Path(os.environ["WORK_ROOT"])
          tag = os.environ["MIHOMO_TAG"]
          asset_name = f"mihomo-linux-amd64-{tag}.gz"
          api_url = f"https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/{tag}"
          api_headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "Sukka-Stash-iOS-Sync/1.5",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          def github_json(url: str) -> dict | list:
              request = urllib.request.Request(url, headers=api_headers)
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code not in {401, 403, 404}:
                      raise
                  public_headers = {
                      key: value
                      for key, value in api_headers.items()
                      if key != "Authorization"
                  }
                  public_request = urllib.request.Request(url, headers=public_headers)
                  with urllib.request.urlopen(public_request, timeout=45) as response:
                      return json.load(response)

          release = github_json(api_url)
          if not isinstance(release, dict) or release.get("tag_name") != tag:
              raise SystemExit(f"GitHub returned unexpected metadata for pinned tag {tag}")

          asset = next(
              (item for item in release.get("assets", []) if item.get("name") == asset_name),
              None,
          )
          if asset is None:
              assets_url = release.get("assets_url")
              if not assets_url:
                  raise SystemExit("Pinned Mihomo release does not expose an assets endpoint")
              for page in range(1, 11):
                  page_assets = github_json(f"{assets_url}?per_page=100&page={page}")
                  if not isinstance(page_assets, list):
                      raise SystemExit("GitHub returned an invalid release asset page")
                  asset = next(
                      (item for item in page_assets if item.get("name") == asset_name),
                      None,
                  )
                  if asset is not None or len(page_assets) < 100:
                      break
          if asset is None:
              raise SystemExit(f"Pinned Mihomo release asset is unavailable: {asset_name}")

          expected = asset.get("digest") or ""
          if not expected and asset.get("url"):
              detailed_asset = github_json(asset["url"])
              if isinstance(detailed_asset, dict):
                  asset = detailed_asset
                  expected = asset.get("digest") or ""
          if not expected.startswith("sha256:") or len(expected) != 71:
              raise SystemExit(
                  f"Official release metadata lacks a valid SHA-256 digest: {asset_name}"
              )

          archive = root / asset_name
          digest = hashlib.sha256()
          request = urllib.request.Request(
              asset["browser_download_url"],
              headers={"User-Agent": "Sukka-Stash-iOS-Sync/1.5"},
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              with archive.open("wb") as handle:
                  while chunk := response.read(1024 * 1024):
                      digest.update(chunk)
                      handle.write(chunk)

          actual = "sha256:" + digest.hexdigest()
          if actual != expected:
              raise SystemExit(
                  f"Mihomo checksum mismatch: expected={expected}, actual={actual}"
              )

          binary = root / "mihomo"
          with gzip.open(archive, "rb") as compressed:
              with binary.open("wb") as executable:
                  shutil.copyfileobj(compressed, executable)
          binary.chmod(binary.stat().st_mode | stat.S_IXUSR)

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as github_env:
              github_env.write(f"MIHOMO_BIN={binary}\n")

          print(f"Installed verified Mihomo {tag}; release digest={actual}")
          PY

      - name: Convert, partition and audit Stash iOS rule sets
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from collections import Counter, defaultdict
          from dataclasses import dataclass
          from pathlib import Path
          import hashlib
          import ipaddress
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys

          ROOT = Path(os.environ["WORK_ROOT"]).resolve()
          SOURCE = ROOT / "source"
          OUTPUT = ROOT / "output"
          REPO = Path(os.getenv("GITHUB_WORKSPACE", os.getcwd())).resolve()
          BUILD_MRS = os.getenv("BUILD_MRS", "true").lower() == "true"
          BUILD_LITE = os.getenv("BUILD_IOS_LITE", "true").lower() == "true"
          ALLOW_DROP = os.getenv("ALLOW_LARGE_DROP", "false").lower() == "true"
          MIN_SOURCES = int(os.getenv("MIN_TOTAL_SOURCE_FILES", "20"))
          MIN_PROVIDERS = int(os.getenv("MIN_TOTAL_PROVIDERS", "20"))
          MIN_RULES = int(os.getenv("MIN_TOTAL_RULES", "1000"))
          MAX_DROP = float(os.getenv("MAX_RULE_DROP_PERCENT", "25"))
          INTERVAL = int(os.getenv("PROVIDER_INTERVAL", "86400"))
          LITE_EXCLUDED = {
              part.strip().upper()
              for part in os.getenv("LITE_EXCLUDED_TYPES", "URL-REGEX,SCRIPT").split(",")
              if part.strip()
          }
          MARKER_SUFFIX = ".m4d3.by.5ukk4w.skk.moe"
          MARKER_EXACT = {"7h15.ru1353t.1s.m4d3.by.5ukk4w.skk.moe"}
          IOS_UNSUPPORTED = {"PROCESS-NAME", "PROCESS-PATH"}
          ALIASES = {"ASN": "IP-ASN", "DEST-PORT": "DST-PORT"}
          DOMAIN_TYPES = {"DOMAIN", "DOMAIN-SUFFIX", "DOMAIN-WILDCARD"}
          CIDR_TYPES = {"IP-CIDR", "IP-CIDR6"}
          STASH_TYPES = DOMAIN_TYPES | CIDR_TYPES | {
              "DOMAIN-KEYWORD",
              "DOMAIN-REGEX",
              "GEOIP",
              "IP-ASN",
              "NETWORK",
              "PROTOCOL",
              "DST-PORT",
              "GEOSITE",
              "SCRIPT",
              "AND",
              "OR",
              "NOT",
              "USER-AGENT",
              "URL-REGEX",
          }
          KNOWN_PROTOCOLS = {"TCP", "UDP", "HTTP", "TLS", "QUIC", "STUN"}
          CATEGORIES = ("domainset", "non_ip", "ip")
          PROFILES = ("ios", "lite") if BUILD_LITE else ("ios",)

          summary = Counter()
          per_category = defaultdict(Counter)
          rule_types = Counter()
          alias_conversions = Counter()
          lite_omissions = Counter()
          file_audit = []
          providers = []
          removed_markers = []
          filtered_process_rules = []
          omitted_lite_rules = []
          deprecated_files = []
          mixed_no_resolve_sources = []
          legacy_no_resolve = []
          mrs_cache = {}
          mrs_total_bytes = 0

          @dataclass(frozen=True)
          class Rule:
              kind: str
              classical: str
              optimized: str
              behavior: str
              no_resolve: bool | None
              original_index: int

          def write_lines(path: Path, lines: list[str]) -> None:
              if not lines:
                  raise ValueError(f"Refusing to create empty rule provider: {path}")
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")

          def write_json(path: Path, value: object) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
                  newline="\n",
              )

          def marker_domain(value: str) -> bool:
              normalized = (
                  value.strip()
                  .removeprefix("+.")
                  .removeprefix("*.")
                  .lstrip(".")
                  .replace("?", "")
                  .rstrip(".")
                  .casefold()
              )
              return normalized in MARKER_EXACT or normalized.endswith(MARKER_SUFFIX)

          def source_is_deprecated(text: str) -> bool:
              lowered = text.casefold()
              return (
                  "deprecated" in lowered
                  or "has been merged with" in lowered
                  or "has been merged into" in lowered
              )

          def normalize_domain(value: str, *, wildcard: bool = False) -> str:
              normalized = value.strip().rstrip(".").casefold()
              if not normalized or normalized in {".", "+.", "*", "*."}:
                  raise ValueError(f"Empty or invalid domain: {value!r}")
              if any(character.isspace() for character in normalized):
                  raise ValueError(f"Whitespace is not valid in a domain: {value!r}")
              if any(character in normalized for character in (",", "/", "\\", "#")):
                  raise ValueError(f"Invalid domain character: {value!r}")
              if not wildcard and any(character in normalized for character in ("*", "?")):
                  raise ValueError(f"Wildcard is not valid for this domain type: {value!r}")
              if ".." in normalized or normalized.startswith("."):
                  raise ValueError(f"Invalid empty domain label: {value!r}")
              if len(normalized) > 253:
                  raise ValueError(f"Domain exceeds 253 characters: {value!r}")
              return normalized

          def normalize_domainset(line: str, index: int) -> Rule:
              original = line.strip()
              suffix = original.startswith(".") or original.startswith("+.")
              raw = original.removeprefix("+.").lstrip(".") if suffix else original
              wildcard = "*" in raw or "?" in raw
              value = normalize_domain(raw, wildcard=wildcard)
              if suffix:
                  return Rule(
                      "DOMAIN-SUFFIX",
                      f"DOMAIN-SUFFIX,{value}",
                      f"+.{value}",
                      "domain",
                      None,
                      index,
                  )
              kind = "DOMAIN-WILDCARD" if wildcard else "DOMAIN"
              return Rule(kind, f"{kind},{value}", value, "domain", None, index)

          def no_resolve_operand(remainder: str, kind: str) -> tuple[str, bool]:
              parts = [part.strip() for part in remainder.split(",")]
              if len(parts) > 2 or not parts[0]:
                  raise ValueError(f"Invalid {kind} operand/options: {remainder!r}")
              if len(parts) == 2 and parts[1].casefold() != "no-resolve":
                  raise ValueError(f"Unsupported {kind} rule option: {parts[1]!r}")
              return parts[0], len(parts) == 2

          def normalize_rule(line: str, index: int, source_name: str) -> Rule:
              if "," not in line:
                  raise ValueError(f"{source_name}: missing rule-type separator: {line!r}")
              raw_kind, remainder = line.split(",", 1)
              original_kind = raw_kind.strip().upper()
              kind = ALIASES.get(original_kind, original_kind)
              if kind != original_kind:
                  alias_conversions[f"{original_kind}->{kind}"] += 1
              if kind not in STASH_TYPES:
                  raise ValueError(f"{source_name}: unsupported Stash rule type {kind!r}")
              remainder = remainder.strip()
              if not remainder:
                  raise ValueError(f"{source_name}: empty operand for {kind}")

              if kind in DOMAIN_TYPES:
                  if "," in remainder:
                      raise ValueError(f"{source_name}: unexpected domain rule option")
                  value = normalize_domain(
                      remainder.lstrip(".") if kind == "DOMAIN-SUFFIX" else remainder,
                      wildcard=kind == "DOMAIN-WILDCARD",
                  )
                  optimized = "+." + value if kind == "DOMAIN-SUFFIX" else value
                  # Routing DOMAIN-WILDCARD is glob syntax, while domain/MRS
                  # providers use Clash label wildcards. They are not equivalent.
                  behavior = "classical" if kind == "DOMAIN-WILDCARD" else "domain"
                  return Rule(
                      kind,
                      f"{kind},{value}",
                      optimized,
                      behavior,
                      None,
                      index,
                  )

              if kind in CIDR_TYPES:
                  operand, no_resolve = no_resolve_operand(remainder, kind)
                  try:
                      network = ipaddress.ip_network(operand, strict=False)
                  except ValueError as error:
                      raise ValueError(
                          f"{source_name}: invalid {kind} CIDR {operand!r}"
                      ) from error
                  expected_version = 4 if kind == "IP-CIDR" else 6
                  if network.version != expected_version:
                      raise ValueError(
                          f"{source_name}: {kind} does not accept IPv{network.version}"
                      )
                  value = str(network)
                  option = ",no-resolve" if no_resolve else ""
                  return Rule(
                      kind,
                      f"{kind},{value}{option}",
                      value,
                      "ipcidr",
                      no_resolve,
                      index,
                  )

              if kind == "IP-ASN":
                  operand, no_resolve = no_resolve_operand(remainder, kind)
                  if not operand.isdecimal() or not (0 <= int(operand) <= 4294967295):
                      raise ValueError(f"{source_name}: invalid autonomous system {operand!r}")
                  value = str(int(operand))
                  option = ",no-resolve" if no_resolve else ""
                  classical = f"{kind},{value}{option}"
                  return Rule(kind, classical, classical, "classical", None, index)

              if kind == "GEOIP":
                  operand, no_resolve = no_resolve_operand(remainder, kind)
                  value = operand.upper()
                  if not re.fullmatch(r"[A-Z]{2}|LAN", value):
                      raise ValueError(f"{source_name}: invalid GEOIP code {operand!r}")
                  option = ",no-resolve" if no_resolve else ""
                  classical = f"{kind},{value}{option}"
                  return Rule(kind, classical, classical, "classical", None, index)

              if kind == "DST-PORT":
                  if not re.fullmatch(r"\d{1,5}(?:-\d{1,5})?", remainder):
                      raise ValueError(f"{source_name}: invalid destination port {remainder!r}")
                  bounds = [int(part) for part in remainder.split("-")]
                  if any(value > 65535 for value in bounds) or bounds != sorted(bounds):
                      raise ValueError(f"{source_name}: invalid destination port {remainder!r}")

              if kind == "NETWORK":
                  remainder = remainder.casefold()
                  if remainder not in {"tcp", "udp"}:
                      raise ValueError(f"{source_name}: invalid network type {remainder!r}")

              if kind == "PROTOCOL":
                  remainder = remainder.upper()
                  if remainder not in KNOWN_PROTOCOLS:
                      raise ValueError(f"{source_name}: invalid protocol {remainder!r}")

              if kind in {"AND", "OR", "NOT"}:
                  if not remainder.startswith("(") or not remainder.endswith(")"):
                      raise ValueError(f"{source_name}: malformed logical rule {line!r}")
                  if remainder.count("(") != remainder.count(")"):
                      raise ValueError(f"{source_name}: unbalanced logical rule {line!r}")

              classical = f"{kind},{remainder}"
              return Rule(kind, classical, classical, "classical", None, index)

          def register_provider(
              *,
              profile: str,
              category: str,
              stem: str,
              source_name: str,
              behavior: str,
              rules: list[Rule],
              path: Path,
              no_resolve: bool | None = None,
              mixed_flags: bool = False,
          ) -> dict:
              global mrs_total_bytes
              lines = [
                  rule.classical if behavior == "classical" else rule.optimized
                  for rule in rules
              ]
              write_lines(path, lines)
              relative = path.relative_to(OUTPUT).as_posix()
              suffix = (
                  "-no-resolve" if mixed_flags and no_resolve is True
                  else "-resolve" if mixed_flags and no_resolve is False
                  else ""
              )
              provider_name = (
                  f"sukka-{profile}-{category}-{stem}-{behavior}{suffix}"
                  .replace("_", "-")
              )
              record = {
                  "profile": profile,
                  "source": source_name,
                  "category": category,
                  "behavior": behavior,
                  "name": provider_name,
                  "text_path": relative,
                  "mrs_path": None,
                  "rule_count": len(rules),
                  "no_resolve": no_resolve,
                  "first_source_index": min(rule.original_index for rule in rules),
              }

              if BUILD_MRS and profile in PROFILES and behavior in {"domain", "ipcidr"}:
                  binary = os.getenv("MIHOMO_BIN")
                  if not binary:
                      raise RuntimeError("BUILD_MRS=true but MIHOMO_BIN is not configured")
                  mrs_path = OUTPUT / "mrs" / path.relative_to(OUTPUT).with_suffix(".mrs")
                  mrs_path.parent.mkdir(parents=True, exist_ok=True)
                  cache_key = (behavior, hashlib.sha256(path.read_bytes()).hexdigest())
                  cached_mrs = mrs_cache.get(cache_key)
                  if cached_mrs is not None:
                      shutil.copyfile(cached_mrs, mrs_path)
                      summary["mrs_cache_hits"] += 1
                  else:
                      completed = subprocess.run(
                          [
                              binary,
                              "convert-ruleset",
                              behavior,
                              "text",
                              str(path),
                              str(mrs_path),
                          ],
                          capture_output=True,
                          check=False,
                          text=True,
                          timeout=120,
                      )
                      if completed.returncode != 0:
                          raise RuntimeError(
                              f"MRS conversion failed for {relative}: "
                              f"{completed.stderr.strip() or completed.stdout.strip()}"
                          )
                  if not mrs_path.is_file() or mrs_path.stat().st_size < 5:
                      raise RuntimeError(f"MRS converter created an empty file: {mrs_path}")
                  with mrs_path.open("rb") as handle:
                      if handle.read(4) != b"MRS\x01":
                          raise RuntimeError(f"Invalid MRS magic header: {mrs_path}")
                  mrs_cache.setdefault(cache_key, mrs_path)
                  record["mrs_path"] = mrs_path.relative_to(OUTPUT).as_posix()
                  mrs_total_bytes += mrs_path.stat().st_size
                  summary["mrs_providers"] += 1

              providers.append(record)
              return record

          def create_legacy(
              category: str,
              stem: str,
              source_name: str,
              rules: list[Rule],
              audit: dict,
          ) -> None:
              if not rules:
                  return
              if category == "domainset" or (
                  category == "non_ip" and all(rule.kind in DOMAIN_TYPES for rule in rules)
              ):
                  behavior = "domain"
                  path = OUTPUT / "domain" / category / f"{stem}.txt"
                  no_resolve = None
              elif category == "ip" and all(rule.behavior == "ipcidr" for rule in rules):
                  behavior = "ipcidr"
                  path = OUTPUT / "ipcidr" / f"{stem}.txt"
                  flags = {rule.no_resolve for rule in rules}
                  no_resolve = True if True in flags else False
                  if flags == {True, False}:
                      audit["legacy_mixed_no_resolve_warning"] = True
                  if no_resolve:
                      legacy_no_resolve.append(stem)
              else:
                  behavior = "classical"
                  path = OUTPUT / "classical" / category / f"{stem}.txt"
                  no_resolve = None

              legacy_rules = rules
              if behavior in {"domain", "ipcidr"}:
                  seen_legacy = set()
                  legacy_rules = []
                  for rule in rules:
                      if rule.optimized in seen_legacy:
                          continue
                      seen_legacy.add(rule.optimized)
                      legacy_rules.append(rule)
                  audit["legacy_collapsed_entries"] = len(rules) - len(legacy_rules)

              provider = register_provider(
                  profile="legacy",
                  category=category,
                  stem=stem,
                  source_name=source_name,
                  behavior=behavior,
                  rules=legacy_rules,
                  path=path,
                  no_resolve=no_resolve,
              )
              audit["legacy_provider"] = provider["text_path"]
              audit["legacy_behavior"] = behavior

          def create_optimized(
              profile: str,
              category: str,
              stem: str,
              source_name: str,
              rules: list[Rule],
              audit: dict,
          ) -> None:
              eligible = []
              for rule in rules:
                  if profile == "lite" and rule.kind in LITE_EXCLUDED:
                      lite_omissions[rule.kind] += 1
                      omitted_lite_rules.append(f"{source_name}: {rule.classical}")
                      continue
                  eligible.append(rule)

              groups: dict[tuple[str, bool | None], list[Rule]] = defaultdict(list)
              cidr_flags = {
                  rule.no_resolve
                  for rule in eligible
                  if rule.behavior == "ipcidr"
              }
              mixed_flags = cidr_flags == {True, False}
              for rule in eligible:
                  key = (
                      rule.behavior,
                      rule.no_resolve if rule.behavior == "ipcidr" else None,
                  )
                  groups[key].append(rule)

              ordered = sorted(
                  groups.items(),
                  key=lambda item: min(rule.original_index for rule in item[1]),
              )
              output_records = []
              for (behavior, flag), grouped in ordered:
                  filename = stem
                  if behavior == "ipcidr" and mixed_flags:
                      filename += ".no_resolve" if flag else ".resolve"
                  path = OUTPUT / profile / behavior / category / f"{filename}.txt"
                  provider = register_provider(
                      profile=profile,
                      category=category,
                      stem=stem,
                      source_name=source_name,
                      behavior=behavior,
                      rules=grouped,
                      path=path,
                      no_resolve=flag if behavior == "ipcidr" else None,
                      mixed_flags=mixed_flags,
                  )
                  output_records.append(provider)
                  if profile == "ios":
                      summary[f"{behavior}_rules"] += len(grouped)
                      summary[f"{behavior}_providers"] += 1

              audit[f"{profile}_providers"] = [
                  {
                      "behavior": record["behavior"],
                      "text_path": record["text_path"],
                      "mrs_path": record["mrs_path"],
                      "rule_count": record["rule_count"],
                      "no_resolve": record["no_resolve"],
                      "name": record["name"],
                  }
                  for record in output_records
              ]
              if profile == "ios" and mixed_flags:
                  mixed_no_resolve_sources.append(source_name)
              if profile == "ios" and len(output_records) > 1:
                  summary["split_source_files"] += 1

          for category in CATEGORIES:
              for source_path in sorted((SOURCE / category).glob("*.conf")):
                  source_name = f"{category}/{source_path.name}"
                  try:
                      text = source_path.read_text(encoding="utf-8", errors="strict")
                  except UnicodeDecodeError as error:
                      raise RuntimeError(f"{source_name}: invalid UTF-8 source encoding") from error

                  lines = [
                      line.strip()
                      for line in text.splitlines()
                      if line.strip() and not line.lstrip().startswith("#")
                  ]
                  audit = {
                      "source": source_name,
                      "category": category,
                      "source_rules": len(lines),
                      "deprecated": source_is_deprecated(text),
                      "markers_removed": 0,
                      "ios_process_filtered": 0,
                      "duplicates_removed": 0,
                      "output_rules": 0,
                      "unaccounted_rules": 0,
                      "legacy_mixed_no_resolve_warning": False,
                      "ios_providers": [],
                      "lite_providers": [],
                  }
                  summary["source_files"] += 1
                  summary["source_rules_total"] += len(lines)
                  per_category[category]["source_files"] += 1
                  per_category[category]["source_rules"] += len(lines)

                  if audit["deprecated"]:
                      summary["deprecated_files"] += 1
                      summary["deprecated_source_rules"] += len(lines)
                      per_category[category]["deprecated_files"] += 1
                      deprecated_files.append(source_name)
                      file_audit.append(audit)
                      continue

                  summary["active_files"] += 1
                  summary["active_source_rules"] += len(lines)
                  per_category[category]["active_files"] += 1
                  parsed = []
                  seen = set()
                  for index, line in enumerate(lines):
                      if category == "domainset":
                          marker_value = line
                          raw_kind = None
                      else:
                          raw_kind = line.split(",", 1)[0].strip().upper()
                          marker_value = (
                              line.split(",", 1)[1].split(",", 1)[0]
                              if "," in line and raw_kind in DOMAIN_TYPES
                              else ""
                          )

                      if marker_value and marker_domain(marker_value):
                          audit["markers_removed"] += 1
                          removed_markers.append(f"{source_name}: {line}")
                          continue
                      if raw_kind in IOS_UNSUPPORTED:
                          audit["ios_process_filtered"] += 1
                          filtered_process_rules.append(f"{source_name}: {line}")
                          continue
                      if raw_kind in {"AND", "OR", "NOT"} and re.search(
                          r"[(,]\s*PROCESS-(?:NAME|PATH)\s*,",
                          line,
                          flags=re.IGNORECASE,
                      ):
                          if raw_kind != "AND":
                              raise ValueError(
                                  f"{source_name}: iOS-incompatible PROCESS rule inside "
                                  f"{raw_kind} cannot be removed without changing semantics"
                              )
                          audit["ios_process_filtered"] += 1
                          filtered_process_rules.append(f"{source_name}: {line}")
                          continue

                      rule = (
                          normalize_domainset(line, index)
                          if category == "domainset"
                          else normalize_rule(line, index, source_name)
                      )
                      key = (rule.kind, rule.classical)
                      if key in seen:
                          audit["duplicates_removed"] += 1
                          continue
                      seen.add(key)
                      parsed.append(rule)
                      rule_types[rule.kind] += 1

                  audit["output_rules"] = len(parsed)
                  accounted = (
                      audit["markers_removed"]
                      + audit["ios_process_filtered"]
                      + audit["duplicates_removed"]
                      + audit["output_rules"]
                  )
                  audit["unaccounted_rules"] = audit["source_rules"] - accounted
                  if audit["unaccounted_rules"] != 0:
                      raise RuntimeError(
                          f"Rule conservation failed for {source_name}: "
                          f"source={audit['source_rules']}, accounted={accounted}"
                      )

                  for field in (
                      "markers_removed",
                      "ios_process_filtered",
                      "duplicates_removed",
                      "output_rules",
                  ):
                      summary[field] += audit[field]
                      per_category[category][field] += audit[field]

                  if parsed:
                      create_legacy(category, source_path.stem, source_name, parsed, audit)
                      for profile in PROFILES:
                          create_optimized(
                              profile,
                              category,
                              source_path.stem,
                              source_name,
                              parsed,
                              audit,
                          )
                  file_audit.append(audit)

          summary["output_providers"] = sum(
              1 for provider in providers if provider["profile"] == "ios"
          )
          summary["legacy_providers"] = sum(
              1 for provider in providers if provider["profile"] == "legacy"
          )
          summary["lite_providers"] = sum(
              1 for provider in providers if provider["profile"] == "lite"
          )
          summary["lite_rules"] = sum(
              provider["rule_count"]
              for provider in providers
              if provider["profile"] == "lite"
          )
          summary["lite_omitted_rules"] = sum(lite_omissions.values())
          summary["mixed_no_resolve_sources"] = len(mixed_no_resolve_sources)
          summary["no_resolve_ipcidr_providers"] = sum(
              1
              for provider in providers
              if provider["profile"] == "ios"
              and provider["behavior"] == "ipcidr"
              and provider["no_resolve"] is True
          )
          summary["mrs_bytes"] = mrs_total_bytes
          summary["unaccounted_rules"] = sum(
              record["unaccounted_rules"] for record in file_audit
          )
          summary["total_physical_providers"] = len(providers)
          summary["alias_conversions"] = sum(alias_conversions.values())

          if summary["source_files"] < MIN_SOURCES:
              raise RuntimeError(
                  f"Too few source files: {summary['source_files']} < {MIN_SOURCES}"
              )
          if summary["legacy_providers"] < MIN_PROVIDERS:
              raise RuntimeError(
                  f"Too few legacy providers: {summary['legacy_providers']} < {MIN_PROVIDERS}"
              )
          if summary["output_rules"] < MIN_RULES:
              raise RuntimeError(f"Too few audited rules: {summary['output_rules']} < {MIN_RULES}")
          if any(per_category[name]["source_files"] == 0 for name in CATEGORIES):
              raise RuntimeError("At least one source category is empty")
          if (
              summary["domain_rules"]
              + summary["ipcidr_rules"]
              + summary["classical_rules"]
              != summary["output_rules"]
          ):
              raise RuntimeError("Optimized profile does not conserve all Full rules")
          if BUILD_LITE and (
              summary["lite_rules"] + summary["lite_omitted_rules"]
              != summary["output_rules"]
          ):
              raise RuntimeError("Lite rules plus explicitly omitted rules are not conserved")

          previous_path = REPO / "SEMANTIC_AUDIT.json"
          if previous_path.is_file():
              try:
                  previous = json.loads(previous_path.read_text(encoding="utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError) as error:
                  raise RuntimeError("Existing SEMANTIC_AUDIT.json is invalid") from error
              previous_rules = int(previous.get("summary", {}).get("output_rules", 0))
              if previous_rules > 0:
                  drop = (previous_rules - summary["output_rules"]) / previous_rules * 100
                  if drop > MAX_DROP and not ALLOW_DROP:
                      raise RuntimeError(
                          f"Upstream rule count dropped by {drop:.2f}% "
                          f"({previous_rules} -> {summary['output_rules']}); "
                          "rerun workflow_dispatch with allow_large_drop=true only after review"
                      )

          repository = os.getenv("GITHUB_REPOSITORY", "OWNER/REPOSITORY")
          branch = os.getenv("GITHUB_REF_NAME", "main")
          raw_base = f"https://raw.githubusercontent.com/{repository}/{branch}"

          def provider_fragment(profile: str, *, prefer_mrs: bool) -> str:
              selected = [
                  provider
                  for provider in providers
                  if provider["profile"] == profile
              ]
              lines = [
                  f"# Stash {profile.upper()} provider declarations; attach your own policies.",
                  "# All providers generated from the same source must use the same policy.",
                  "rule-providers:",
              ]
              for provider in selected:
                  use_mrs = (
                      prefer_mrs
                      and provider["mrs_path"] is not None
                      and provider["behavior"] in {"domain", "ipcidr"}
                  )
                  relative = provider["mrs_path"] if use_mrs else provider["text_path"]
                  lines.extend(
                      [
                          f"  {provider['name']}:",
                          f"    behavior: {provider['behavior']}",
                          f"    format: {'mrs' if use_mrs else 'text'}",
                          f"    url: {raw_base}/{relative}",
                          f"    interval: {INTERVAL}",
                      ]
                  )
              lines.append("")
              lines.append("# Keep each source's provider order from PROVIDER_MANIFEST.json.")
              lines.append("# Add ,no-resolve only when the manifest marks an ipcidr provider.")
              return "\n".join(lines) + "\n"

          for profile in PROFILES:
              label = "FULL" if profile == "ios" else "LITE"
              (OUTPUT / f"STASH_PROVIDERS_{label}_TEXT.yaml").write_text(
                  provider_fragment(profile, prefer_mrs=False),
                  encoding="utf-8",
                  newline="\n",
              )
              if BUILD_MRS:
                  (OUTPUT / f"STASH_PROVIDERS_{label}_MRS.yaml").write_text(
                      provider_fragment(profile, prefer_mrs=True),
                      encoding="utf-8",
                      newline="\n",
                  )

          manifest = {
              "schema": "sukka-stash-provider-manifest/v1",
              "generator": "Sukka List to Stash V1.5",
              "raw_base_url": raw_base,
              "profiles": list(PROFILES),
              "lite_excluded_rule_types": sorted(LITE_EXCLUDED) if BUILD_LITE else [],
              "providers": providers,
              "source_provider_order": {
                  record["source"]: {
                      profile: [
                          {
                              "name": provider["name"],
                              "behavior": provider["behavior"],
                              "no_resolve": provider["no_resolve"],
                          }
                          for provider in providers
                          if provider["source"] == record["source"]
                          and provider["profile"] == profile
                      ]
                      for profile in PROFILES
                  }
                  for record in file_audit
                  if not record["deprecated"]
              },
          }
          audit_document = {
              "schema": "sukka-stash-semantic-audit/v1.5",
              "summary": dict(sorted(summary.items())),
              "categories": {
                  category: dict(sorted(per_category[category].items()))
                  for category in CATEGORIES
              },
              "rule_types": dict(sorted(rule_types.items())),
              "alias_conversions": dict(sorted(alias_conversions.items())),
              "lite_omissions": dict(sorted(lite_omissions.items())),
              "mixed_no_resolve_sources": sorted(mixed_no_resolve_sources),
              "files": file_audit,
          }
          write_json(OUTPUT / "PROVIDER_MANIFEST.json", manifest)
          write_json(OUTPUT / "SEMANTIC_AUDIT.json", audit_document)
          write_json(
              OUTPUT / "IOS_LITE_OMISSIONS.json",
              {
                  "enabled": BUILD_LITE,
                  "excluded_rule_types": sorted(LITE_EXCLUDED) if BUILD_LITE else [],
                  "counts": dict(sorted(lite_omissions.items())),
                  "total": summary["lite_omitted_rules"],
              },
          )

          text_artifacts = {
              "REMOVED_SUKKA_MARKERS.txt": sorted(removed_markers),
              "IOS_FILTERED_PROCESS_RULES.txt": sorted(filtered_process_rules),
              "IOS_LITE_OMITTED_RULES.txt": sorted(omitted_lite_rules),
              "IPCIDR_NO_RESOLVE.txt": sorted(legacy_no_resolve),
              "DEPRECATED_SOURCE_FILES.txt": sorted(deprecated_files),
          }
          for filename, values in text_artifacts.items():
              (OUTPUT / filename).write_text(
                  "\n".join(values) + ("\n" if values else ""),
                  encoding="utf-8",
                  newline="\n",
              )

          fence = chr(96) * 3
          sample = next(
              (
                  record
                  for record in file_audit
                  if record["source"] == "non_ip/ai.conf"
              ),
              None,
          )
          example_lines = []
          if sample:
              for item in sample["ios_providers"]:
                  suffix = (
                      ",no-resolve"
                      if item["behavior"] == "ipcidr" and item["no_resolve"] is True
                      else ""
                  )
                  example_lines.append(f"  - RULE-SET,{item['name']},PROXY{suffix}")
          if not example_lines:
              example_lines.append("  # Select provider names from PROVIDER_MANIFEST.json.")

          readme = [
              "# Sukka List for Stash iOS",
              "",
              "V1.5 preserves existing provider URLs while adding rule-by-rule optimized",
              "Full and Lite profiles. Only reference one profile for a given source.",
              "",
              "| Output | Compatibility | Behavior |",
              "| --- | --- | --- |",
              "| domain/, ipcidr/, classical/ | Existing V1.4.2.1 URLs | Legacy-compatible |",
              "| ios/domain/, ios/ipcidr/ | New Full profile | Optimized domain and CIDR |",
              "| ios/classical/ | New Full profile | Unsupported-for-promotion remainder |",
              "| lite/ | iOS Lite profile | Omits only explicitly audited expensive rules |",
              "| mrs/ios/, mrs/lite/ | Optional MRS mirrors | domain/ipcidr only |",
              "",
              "## Semantic guarantees",
              "",
              "- Full profile conserves every non-marker, iOS-supported upstream rule.",
              "- DOMAIN and DOMAIN-SUFFIX become domain providers.",
              "- DOMAIN-WILDCARD remains classical because routing glob semantics",
              "  are not equivalent to domain/MRS provider label wildcards.",
              "- IP-CIDR and IP-CIDR6 become ipcidr providers.",
              "- Mixed resolving/no-resolve CIDRs use separate provider files.",
              "- DOMAIN-KEYWORD, DOMAIN-REGEX, ASN and other supported special rules",
              "  remain in small classical providers.",
              "- Existing root-level provider URLs retain their historical contents.",
              "- Lite omissions are listed in IOS_LITE_OMISSIONS.json and",
              "  IOS_LITE_OMITTED_RULES.txt; Full never silently discards those rules.",
              "",
              "## Stash configuration",
              "",
              "Start with STASH_PROVIDERS_FULL_MRS.yaml or",
              "STASH_PROVIDERS_LITE_MRS.yaml when MRS is enabled; TEXT variants are",
              "always available. Copy only the providers you actually reference.",
              "",
              "Providers split from the same source must be adjacent and use the same",
              "policy. Preserve the order in PROVIDER_MANIFEST.json. For example:",
              "",
              fence + "yaml",
              "rules:",
              *example_lines,
              fence,
              "",
              "Add no-resolve only to RULE-SET references whose ipcidr manifest",
              "entry has no_resolve=true. Classical GEOIP/IP-ASN entries preserve",
              "their inline no-resolve option.",
              "",
              "On iOS, keep DNS upstreams to one or two and avoid loading both Full",
              "and Lite or both legacy and optimized versions of the same rule set.",
          ]
          (OUTPUT / "README.md").write_text(
              "\n".join(readme) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          report = [
              "# Sukka to Stash semantic conversion report",
              "",
              f"- Source files: {summary['source_files']}",
              f"- Active source rules: {summary['active_source_rules']}",
              f"- Full conserved output rules: {summary['output_rules']}",
              f"- Optimized domain rules: {summary['domain_rules']}",
              f"- Optimized ipcidr rules: {summary['ipcidr_rules']}",
              f"- Classical remainder rules: {summary['classical_rules']}",
              f"- Split source files: {summary['split_source_files']}",
              f"- Mixed no-resolve sources: {summary['mixed_no_resolve_sources']}",
              f"- iOS Lite omitted rules: {summary['lite_omitted_rules']}",
              f"- MRS providers: {summary['mrs_providers']}",
              f"- Reused identical MRS conversions: {summary['mrs_cache_hits']}",
              f"- MRS bytes: {summary['mrs_bytes']}",
              f"- Removed Sukka markers: {summary['markers_removed']}",
              f"- Filtered iOS process rules: {summary['ios_process_filtered']}",
              f"- Duplicates removed: {summary['duplicates_removed']}",
              f"- Unaccounted rules: {summary['unaccounted_rules']}",
              "",
          ]
          (OUTPUT / "CONVERSION_REPORT.md").write_text(
              "\n".join(report),
              encoding="utf-8",
              newline="\n",
          )
          (OUTPUT / "SEMANTIC_AUDIT.md").write_text(
              "\n".join(report)
              + "\nFull source-by-source details: SEMANTIC_AUDIT.json.\n",
              encoding="utf-8",
              newline="\n",
          )

          rule_files = sorted(
              path
              for directory in ("domain", "ipcidr", "classical", "ios", "lite", "mrs")
              if (OUTPUT / directory).is_dir()
              for path in (OUTPUT / directory).rglob("*")
              if path.is_file() and path.suffix in {".txt", ".mrs"}
          )
          checksum_lines = [
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  "
              f"{path.relative_to(OUTPUT).as_posix()}"
              for path in rule_files
          ]
          checksum_content = "\n".join(checksum_lines) + "\n"
          (OUTPUT / "RULES_SHA256SUMS.txt").write_text(
              checksum_content,
              encoding="utf-8",
              newline="\n",
          )
          fingerprint = hashlib.sha256()
          fingerprint.update(checksum_content.encode("utf-8"))
          fingerprint.update(
              json.dumps(manifest, ensure_ascii=False, sort_keys=True).encode("utf-8")
          )
          (OUTPUT / "RULES_VERSION.sha256").write_text(
              fingerprint.hexdigest() + "\n",
              encoding="utf-8",
              newline="\n",
          )

          print(json.dumps(dict(sorted(summary.items())), ensure_ascii=False, indent=2))
          print(f"Prepared {len(rule_files)} checksummed physical rule files.")
          PY

      - name: Validate staged providers and semantic artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from collections import Counter
          from pathlib import Path
          import ipaddress
          import json
          import os

          output = Path(os.environ["WORK_ROOT"]) / "output"
          manifest = json.loads((output / "PROVIDER_MANIFEST.json").read_text("utf-8"))
          audit = json.loads((output / "SEMANTIC_AUDIT.json").read_text("utf-8"))
          names = Counter()

          for provider in manifest["providers"]:
              names[(provider["profile"], provider["name"])] += 1
              path = output / provider["text_path"]
              if not path.is_file() or path.stat().st_size == 0:
                  raise RuntimeError(f"Missing or empty provider: {path}")
              lines = path.read_text(encoding="utf-8", errors="strict").splitlines()
              if len(lines) != provider["rule_count"]:
                  raise RuntimeError(f"Provider count mismatch: {path}")
              if len(lines) != len(set(lines)):
                  raise RuntimeError(f"Provider contains duplicate entries: {path}")
              if provider["behavior"] == "domain":
                  if any("," in line or line.startswith("DOMAIN") for line in lines):
                      raise RuntimeError(f"Domain provider contains classical syntax: {path}")
                  if provider["no_resolve"] is not None:
                      raise RuntimeError(f"Domain provider cannot use no-resolve: {path}")
              elif provider["behavior"] == "ipcidr":
                  for line in lines:
                      if "," in line:
                          raise RuntimeError(f"CIDR provider contains rule options: {path}")
                      ipaddress.ip_network(line, strict=True)
                  if not isinstance(provider["no_resolve"], bool):
                      raise RuntimeError(f"CIDR provider lacks no-resolve state: {path}")
              elif provider["behavior"] == "classical":
                  if any("," not in line for line in lines):
                      raise RuntimeError(f"Classical provider contains bare entries: {path}")
                  if provider["no_resolve"] is not None:
                      raise RuntimeError(f"Classical provider has provider-level no-resolve: {path}")
              else:
                  raise RuntimeError(f"Unknown provider behavior: {provider['behavior']}")

              if provider["mrs_path"] is not None:
                  if provider["behavior"] == "classical":
                      raise RuntimeError("Classical providers cannot use the MRS format")
                  mrs = output / provider["mrs_path"]
                  with mrs.open("rb") as handle:
                      if handle.read(4) != b"MRS\x01":
                          raise RuntimeError(f"Invalid MRS provider: {mrs}")

          duplicates = [name for name, count in names.items() if count != 1]
          if duplicates:
              raise RuntimeError(f"Provider names are not unique: {duplicates}")
          if audit["summary"]["unaccounted_rules"] != 0:
              raise RuntimeError("Semantic audit reports unaccounted upstream rules")

          for path in output.rglob("*.txt"):
              if path.name in {
                  "REMOVED_SUKKA_MARKERS.txt",
                  "IOS_FILTERED_PROCESS_RULES.txt",
                  "IOS_LITE_OMITTED_RULES.txt",
                  "IPCIDR_NO_RESOLVE.txt",
                  "DEPRECATED_SOURCE_FILES.txt",
                  "RULES_SHA256SUMS.txt",
              }:
                  continue
              content = path.read_text(encoding="utf-8", errors="strict").casefold()
              if ".m4d3.by.5ukk4w.skk.moe" in content:
                  raise RuntimeError(f"Sukka marker leaked into output provider: {path}")
              if "process-name," in content or "process-path," in content:
                  raise RuntimeError(f"iOS-incompatible process rule leaked into {path}")

          print(f"Validated {len(manifest['providers'])} providers and semantic conservation.")
          PY
          (
            cd "$WORK_ROOT/output"
            sha256sum --check RULES_SHA256SUMS.txt --status
          )

      - name: Publish validated managed outputs into checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import os
          import shutil

          repo = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          output = (Path(os.environ["WORK_ROOT"]) / "output").resolve()
          managed_directories = ("domain", "ipcidr", "classical", "ios", "lite", "mrs")
          managed_files = (
              "README.md",
              "CONVERSION_REPORT.md",
              "SEMANTIC_AUDIT.md",
              "SEMANTIC_AUDIT.json",
              "PROVIDER_MANIFEST.json",
              "IOS_LITE_OMISSIONS.json",
              "IOS_LITE_OMITTED_RULES.txt",
              "REMOVED_SUKKA_MARKERS.txt",
              "IOS_FILTERED_PROCESS_RULES.txt",
              "IPCIDR_NO_RESOLVE.txt",
              "DEPRECATED_SOURCE_FILES.txt",
              "RULES_SHA256SUMS.txt",
              "RULES_VERSION.sha256",
              "STASH_PROVIDERS_FULL_TEXT.yaml",
              "STASH_PROVIDERS_FULL_MRS.yaml",
              "STASH_PROVIDERS_LITE_TEXT.yaml",
              "STASH_PROVIDERS_LITE_MRS.yaml",
          )

          if repo == output or repo in output.parents or output in repo.parents:
              raise RuntimeError("Staging and repository directories must be independent")

          for name in managed_directories:
              destination = repo / name
              staged = output / name
              if destination.parent != repo or destination.is_symlink():
                  raise RuntimeError(f"Unsafe managed directory target: {destination}")
              if destination.exists():
                  if not destination.is_dir():
                      raise RuntimeError(f"Managed directory is not a directory: {destination}")
                  shutil.rmtree(destination)
              if staged.is_dir():
                  shutil.copytree(staged, destination)

          for name in managed_files:
              destination = repo / name
              staged = output / name
              if destination.parent != repo or destination.is_symlink():
                  raise RuntimeError(f"Unsafe managed file target: {destination}")
              if staged.is_file():
                  shutil.copy2(staged, destination)
              elif destination.exists():
                  if not destination.is_file():
                      raise RuntimeError(f"Managed file is not a regular file: {destination}")
                  destination.unlink()

          print("Copied only explicitly managed, prevalidated outputs into the repository.")
          PY
          sha256sum --check RULES_SHA256SUMS.txt --status

      - name: Commit and push only validated changes
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r managed_path; do
            [ -n "$managed_path" ] || continue
            if [ -e "$managed_path" ] || \
              git ls-files --error-unmatch -- "$managed_path" >/dev/null 2>&1; then
              git add --all -- "$managed_path"
            fi
          done <<'MANAGED'
          domain
          ipcidr
          classical
          ios
          lite
          mrs
          README.md
          CONVERSION_REPORT.md
          SEMANTIC_AUDIT.md
          SEMANTIC_AUDIT.json
          PROVIDER_MANIFEST.json
          IOS_LITE_OMISSIONS.json
          IOS_LITE_OMITTED_RULES.txt
          REMOVED_SUKKA_MARKERS.txt
          IOS_FILTERED_PROCESS_RULES.txt
          IPCIDR_NO_RESOLVE.txt
          DEPRECATED_SOURCE_FILES.txt
          RULES_SHA256SUMS.txt
          RULES_VERSION.sha256
          STASH_PROVIDERS_FULL_TEXT.yaml
          STASH_PROVIDERS_FULL_MRS.yaml
          STASH_PROVIDERS_LITE_TEXT.yaml
          STASH_PROVIDERS_LITE_MRS.yaml
          MANAGED

          if git diff --cached --quiet; then
            printf 'No semantic rule-set changes detected; nothing to commit.\n'
            exit 0
          fi

          sha256sum --check RULES_SHA256SUMS.txt --status
          version="$(head -c 12 RULES_VERSION.sha256)"
          git commit -m "chore(stash): sync Sukka iOS hybrid rules [$version]"
          git push origin "HEAD:$GITHUB_REF_NAME"
