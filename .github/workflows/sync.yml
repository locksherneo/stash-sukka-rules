
name: Sukka List to Stash V1.0 Final

on:
  workflow_dispatch:

  schedule:
    # 每 24 小时同步一次
    # UTC 06:20
    - cron: "20 6 * * *"

permissions:
  contents: write

concurrency:
  group: sukka-stash-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SOURCE_BASE: https://ruleset.skk.moe
      MIN_TOTAL_RULES: 20

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # 2. Configure Git
      # ==========================================================

      - name: Configure Git
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


      # ==========================================================
      # 3. Prepare workspace
      # ==========================================================

      - name: Prepare workspace
        run: |
          set -euo pipefail

          rm -rf /tmp/sukka-stash

          mkdir -p /tmp/sukka-stash/source/domainset
          mkdir -p /tmp/sukka-stash/source/non_ip
          mkdir -p /tmp/sukka-stash/source/ip

          mkdir -p /tmp/sukka-stash/output/domain
          mkdir -p /tmp/sukka-stash/output/non_ip
          mkdir -p /tmp/sukka-stash/output/ip


      # ==========================================================
      # 4. Fetch Sukka index
      # ==========================================================

      - name: Fetch Sukka index
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 60 \
            "${SOURCE_BASE}/" \
            -o /tmp/sukka-stash/index.html

          if [ ! -s /tmp/sukka-stash/index.html ]; then
            echo "ERROR: Sukka index is empty."
            exit 1
          fi


      # ==========================================================
      # 5. Discover List rules
      # ==========================================================

      - name: Discover Sukka List rules
        run: |
          set -euo pipefail

          grep -oE \
            'List/(domainset|non_ip|ip)/[^"<> ]+\.conf' \
            /tmp/sukka-stash/index.html \
            | sort -u \
            > /tmp/sukka-stash/files.txt

          TOTAL=$(wc -l < /tmp/sukka-stash/files.txt)

          DOMAINSET=$(
            grep -c '^List/domainset/' \
            /tmp/sukka-stash/files.txt || true
          )

          NON_IP=$(
            grep -c '^List/non_ip/' \
            /tmp/sukka-stash/files.txt || true
          )

          IP=$(
            grep -c '^List/ip/' \
            /tmp/sukka-stash/files.txt || true
          )

          echo "===================================="
          echo " Sukka List"
          echo "===================================="
          echo " domainset : ${DOMAINSET}"
          echo " non_ip    : ${NON_IP}"
          echo " ip        : ${IP}"
          echo "------------------------------------"
          echo " TOTAL     : ${TOTAL}"
          echo "===================================="

          if [ "${TOTAL}" -lt "${MIN_TOTAL_RULES}" ]; then
            echo "ERROR: Too few rules discovered."
            exit 1
          fi


      # ==========================================================
      # 6. Download Sukka List
      # ==========================================================

      - name: Download Sukka List rules
        run: |
          set -euo pipefail

          while IFS= read -r FILE; do

            [ -z "${FILE}" ] && continue

            RELATIVE="${FILE#List/}"

            DEST="/tmp/sukka-stash/source/${RELATIVE}"

            mkdir -p "$(dirname "${DEST}")"

            echo "↓ ${FILE}"

            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 3 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 120 \
              "${SOURCE_BASE}/${FILE}" \
              -o "${DEST}"

            if [ ! -s "${DEST}" ]; then
              echo "ERROR: Empty source file: ${FILE}"
              exit 1
            fi

          done < /tmp/sukka-stash/files.txt


      # ==========================================================
      # 7. Convert Sukka List → Stash
      # ==========================================================

      - name: Convert List rules to Stash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          SRC = Path("/tmp/sukka-stash/source")
          OUT = Path("/tmp/sukka-stash/output")

          skipped = []
          generated = 0


          def deprecated(text: str) -> bool:
              low = text.lower()

              return (
                  "deprecated" in low
                  or "has been merged with" in low
                  or "has been merged into" in low
              )


          # ======================================================
          # domainset -> behavior: domain
          #
          # Stash domain text provider 支持：
          #
          # example.com
          # +.example.com
          # ======================================================

          for src in sorted(
              (SRC / "domainset").glob("*.conf")
          ):

              text = src.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              if deprecated(text):
                  skipped.append(
                      f"DEPRECATED: domainset/{src.name}"
                  )
                  continue

              output = []

              for raw in text.splitlines():

                  line = raw.strip()

                  if not line:
                      continue

                  if line.startswith("#"):
                      continue

                  if line.startswith("."):

                      # Sukka .example.com
                      # 转换 Stash +.example.com
                      output.append(
                          "+." + line[1:]
                      )

                  else:

                      output.append(line)


              if not output:

                  skipped.append(
                      f"EMPTY: domainset/{src.name}"
                  )
                  continue


              dst = (
                  OUT
                  / "domain"
                  / f"{src.stem}.txt"
              )

              dst.write_text(
                  "\n".join(output) + "\n",
                  encoding="utf-8"
              )

              generated += 1


          # ======================================================
          # non_ip -> behavior: classical
          #
          # 直接保留 Sukka List 规则语法
          # ======================================================

          for src in sorted(
              (SRC / "non_ip").glob("*.conf")
          ):

              text = src.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              if deprecated(text):
                  skipped.append(
                      f"DEPRECATED: non_ip/{src.name}"
                  )
                  continue

              output = []

              for raw in text.splitlines():

                  line = raw.strip()

                  if not line:
                      continue

                  if line.startswith("#"):
                      continue

                  output.append(line)


              if not output:

                  skipped.append(
                      f"EMPTY: non_ip/{src.name}"
                  )
                  continue


              dst = (
                  OUT
                  / "non_ip"
                  / f"{src.stem}.txt"
              )

              dst.write_text(
                  "\n".join(output) + "\n",
                  encoding="utf-8"
              )

              generated += 1


          # ======================================================
          # ip -> behavior: classical
          #
          # 保留：
          # IP-CIDR
          # IP-CIDR6
          # IP-ASN
          # GEOIP
          # no-resolve
          # ======================================================

          for src in sorted(
              (SRC / "ip").glob("*.conf")
          ):

              text = src.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              if deprecated(text):
                  skipped.append(
                      f"DEPRECATED: ip/{src.name}"
                  )
                  continue

              output = []

              for raw in text.splitlines():

                  line = raw.strip()

                  if not line:
                      continue

                  if line.startswith("#"):
                      continue

                  output.append(line)


              if not output:

                  skipped.append(
                      f"EMPTY: ip/{src.name}"
                  )
                  continue


              dst = (
                  OUT
                  / "ip"
                  / f"{src.stem}.txt"
              )

              dst.write_text(
                  "\n".join(output) + "\n",
                  encoding="utf-8"
              )

              generated += 1


          print(
              f"Generated {generated} Stash rule sets."
          )


          if skipped:

              Path(
                  "/tmp/sukka-stash/skipped.txt"
              ).write_text(
                  "\n".join(skipped),
                  encoding="utf-8"
              )

              print("")
              print("Skipped:")

              for item in skipped:
                  print(f"  {item}")


          if generated == 0:
              raise RuntimeError(
                  "No Stash rule sets generated."
              )

          PY


      # ==========================================================
      # 8. Validate output
      # ==========================================================

      - name: Validate Stash output
        run: |
          set -euo pipefail

          DOMAIN=$(
            find /tmp/sukka-stash/output/domain \
              -type f \
              -name "*.txt" \
              | wc -l
          )

          NON_IP=$(
            find /tmp/sukka-stash/output/non_ip \
              -type f \
              -name "*.txt" \
              | wc -l
          )

          IP=$(
            find /tmp/sukka-stash/output/ip \
              -type f \
              -name "*.txt" \
              | wc -l
          )

          TOTAL=$((DOMAIN + NON_IP + IP))

          echo ""
          echo "===================================="
          echo " Stash Rule Sets"
          echo "===================================="
          echo " domain : ${DOMAIN}"
          echo " non_ip : ${NON_IP}"
          echo " ip     : ${IP}"
          echo "------------------------------------"
          echo " TOTAL  : ${TOTAL}"
          echo "===================================="

          if [ "${TOTAL}" -lt "${MIN_TOTAL_RULES}" ]; then
            echo "ERROR: Too few Stash rule sets."
            exit 1
          fi


      # ==========================================================
      # 9. Check dangerous / invalid lines
      # ==========================================================

      - name: Validate Stash rule syntax
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          root = Path(
              "/tmp/sukka-stash/output"
          )

          allowed = {
              "DOMAIN",
              "DOMAIN-SUFFIX",
              "DOMAIN-KEYWORD",
              "DOMAIN-REGEX",
              "DOMAIN-WILDCARD",
              "IP-CIDR",
              "IP-CIDR6",
              "IP-ASN",
              "GEOIP",
              "URL-REGEX",
              "USER-AGENT",
              "DEST-PORT",
              "DST-PORT",
              "PROTOCOL",
          }

          errors = []


          # domain provider
          for file in (
              root / "domain"
          ).glob("*.txt"):

              for i, raw in enumerate(
                  file.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  ).splitlines(),
                  1
              ):

                  line = raw.strip()

                  if not line:
                      continue

                  if "," in line:
                      errors.append(
                          f"{file}:{i}: "
                          f"unexpected classical syntax"
                      )


          # classical providers
          for folder in ["non_ip", "ip"]:

              for file in (
                  root / folder
              ).glob("*.txt"):

                  for i, raw in enumerate(
                      file.read_text(
                          encoding="utf-8",
                          errors="ignore"
                      ).splitlines(),
                      1
                  ):

                      line = raw.strip()

                      if not line:
                          continue

                      if "," not in line:
                          errors.append(
                              f"{file}:{i}: "
                              f"missing comma"
                          )
                          continue

                      rule_type = (
                          line.split(",", 1)[0]
                          .strip()
                          .upper()
                      )

                      if rule_type not in allowed:
                          errors.append(
                              f"{file}:{i}: "
                              f"unknown type "
                              f"{rule_type}"
                          )


          if errors:

              print("")
              print("Invalid rules:")

              for item in errors[:50]:
                  print(item)

              raise RuntimeError(
                  f"{len(errors)} invalid rules found"
              )


          print("Stash rule syntax validation passed.")

          PY


      # ==========================================================
      # 10. Generate report
      # ==========================================================

      - name: Generate conversion report
        run: |
          set -euo pipefail

          {
            echo "# Sukka -> Stash Conversion Report"
            echo ""
            echo "Source:"
            echo ""
            echo "https://ruleset.skk.moe/"
            echo ""
            echo "## Mapping"
            echo ""
            echo "- List/domainset -> domain/*.txt"
            echo "- List/non_ip -> non_ip/*.txt"
            echo "- List/ip -> ip/*.txt"
            echo ""
            echo "## Skipped source files"
            echo ""

            if [ -s /tmp/sukka-stash/skipped.txt ]; then

              sed 's/^/- /' \
                /tmp/sukka-stash/skipped.txt

            else

              echo "- None"

            fi

          } > /tmp/sukka-stash/REPORT.md


      # ==========================================================
      # 11. Generate new checksum
      # ==========================================================

      - name: Generate new checksum
        run: |
          set -euo pipefail

          cd /tmp/sukka-stash/output

          find domain non_ip ip \
            -type f \
            -name "*.txt" \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > /tmp/sukka-stash/new.sha256

          sha256sum \
            /tmp/sukka-stash/new.sha256 \
            | awk '{print $1}' \
            > /tmp/sukka-stash/new.master


      # ==========================================================
      # 12. Current checksum
      # ==========================================================

      - name: Generate current checksum
        run: |
          set -euo pipefail

          if [ -d domain ] && \
             [ -d non_ip ] && \
             [ -d ip ] && \
             find domain non_ip ip \
               -type f \
               -name "*.txt" \
               | grep -q .; then

            find domain non_ip ip \
              -type f \
              -name "*.txt" \
              -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > /tmp/sukka-stash/current.sha256

            sha256sum \
              /tmp/sukka-stash/current.sha256 \
              | awk '{print $1}' \
              > /tmp/sukka-stash/current.master

          else

            echo "none" \
              > /tmp/sukka-stash/current.master

          fi


      # ==========================================================
      # 13. Compare
      # ==========================================================

      - name: Compare rule versions
        id: compare
        run: |
          set -euo pipefail

          NEW=$(cat /tmp/sukka-stash/new.master)
          OLD=$(cat /tmp/sukka-stash/current.master)

          echo "Old: ${OLD}"
          echo "New: ${NEW}"

          if [ "${NEW}" = "${OLD}" ]; then

            echo "changed=false" \
              >> "$GITHUB_OUTPUT"

            echo "Rules already up to date."

          else

            echo "changed=true" \
              >> "$GITHUB_OUTPUT"

            echo "New rules detected."

          fi


      # ==========================================================
      # 14. Replace
      # ==========================================================

      - name: Replace Stash rules
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail

          rm -rf domain.new
          rm -rf non_ip.new
          rm -rf ip.new


          cp -a \
            /tmp/sukka-stash/output/domain \
            domain.new

          cp -a \
            /tmp/sukka-stash/output/non_ip \
            non_ip.new

          cp -a \
            /tmp/sukka-stash/output/ip \
            ip.new


          DOMAIN_COUNT=$(
            find domain.new \
              -type f \
              -name "*.txt" \
              | wc -l
          )

          NON_IP_COUNT=$(
            find non_ip.new \
              -type f \
              -name "*.txt" \
              | wc -l
          )

          IP_COUNT=$(
            find ip.new \
              -type f \
              -name "*.txt" \
              | wc -l
          )

          TOTAL=$(
            (
              DOMAIN_COUNT
            )
          )

          TOTAL=$(
            expr \
              "${DOMAIN_COUNT}" \
              + "${NON_IP_COUNT}" \
              + "${IP_COUNT}"
          )

          if [ "${TOTAL}" -lt "${MIN_TOTAL_RULES}" ]; then

            echo "ERROR: Replacement validation failed."

            exit 1
          fi


          rm -rf domain non_ip ip

          mv domain.new domain
          mv non_ip.new non_ip
          mv ip.new ip


      # ==========================================================
      # 15. Save checksum / report
      # ==========================================================

      - name: Save metadata
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail

          cp \
            /tmp/sukka-stash/new.sha256 \
            RULES_SHA256SUMS.txt

          cp \
            /tmp/sukka-stash/new.master \
            RULES_VERSION.sha256

          cp \
            /tmp/sukka-stash/REPORT.md \
            CONVERSION_REPORT.md


      # ==========================================================
      # 16. README
      # ==========================================================

      - name: Update README
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail

          DOMAIN=$(
            find domain \
              -type f \
              -name "*.txt" \
              | wc -l
          )

          NON_IP=$(
            find non_ip \
              -type f \
              -name "*.txt" \
              | wc -l
          )

          IP=$(
            find ip \
              -type f \
              -name "*.txt" \
              | wc -l
          )

          TOTAL=$((DOMAIN + NON_IP + IP))

          VERSION=$(
            cat RULES_VERSION.sha256
          )


          cat > README.md <<EOF
          # Sukka Rules for Stash

          自动将 Sukka Ruleset Server 的通用 List 转换为 Stash Rule Provider。

          ## Upstream

          https://ruleset.skk.moe/

          ## Mapping

          \`\`\`text
          List/domainset -> domain/
          List/non_ip    -> non_ip/
          List/ip        -> ip/
          \`\`\`

          ## Provider Type

          | Directory | Stash behavior | format |
          |---|---|---|
          | domain | domain | text |
          | non_ip | classical | text |
          | ip | classical | text |

          ## Rule Count

          | Type | Count |
          |---|---:|
          | domain | ${DOMAIN} |
          | non_ip | ${NON_IP} |
          | ip | ${IP} |
          | Total | ${TOTAL} |

          ## Version

          \`\`\`
          ${VERSION}
          \`\`\`

          ## Raw Examples

          \`\`\`text
          https://raw.githubusercontent.com/locksherneo/stash-sukka-rules/main/domain/apple_cdn.txt

          https://raw.githubusercontent.com/locksherneo/stash-sukka-rules/main/non_ip/ai.txt

          https://raw.githubusercontent.com/locksherneo/stash-sukka-rules/main/ip/telegram.txt
          \`\`\`

          ## Stash Example

          \`\`\`yaml
          rule-providers:

            sukka-apple-cdn:
              type: http
              behavior: domain
              format: text
              url: https://raw.githubusercontent.com/locksherneo/stash-sukka-rules/main/domain/apple_cdn.txt
              interval: 86400

            sukka-ai:
              type: http
              behavior: classical
              format: text
              url: https://raw.githubusercontent.com/locksherneo/stash-sukka-rules/main/non_ip/ai.txt
              interval: 86400

            sukka-telegram-ip:
              type: http
              behavior: classical
              format: text
              url: https://raw.githubusercontent.com/locksherneo/stash-sukka-rules/main/ip/telegram.txt
              interval: 86400

          rules:

            - RULE-SET,sukka-ai,AI
            - RULE-SET,sukka-telegram-ip,Telegram
            - RULE-SET,sukka-apple-cdn,DIRECT
            - MATCH,Proxy
          \`\`\`

          ## Features

          - 每 24 小时同步一次
          - 直接读取 Sukka 通用 List
          - domainset 自动转换为 Stash domain provider
          - non_ip 保留 classical 规则语义
          - ip 保留 IP-CIDR / IP-CIDR6 / IP-ASN / GEOIP
          - 保留 no-resolve
          - 自动跳过 Deprecated
          - 规则语法检查
          - SHA256 校验
          - 无变化不 Commit

          ---

          Generated by Sukka List -> Stash V1.0 Final.
          EOF


      # ==========================================================
      # 17. Commit
      # ==========================================================

      - name: Commit changes
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git add -A

          if git diff \
            --cached \
            --quiet; then

            echo "No effective changes."

            exit 0
          fi

          git commit \
            -m "chore: sync Sukka List rules for Stash"

          git push


      # ==========================================================
      # 18. Completed
      # ==========================================================

      - name: Completed
        run: |
          echo ""
          echo "===================================="
          echo " Sukka List -> Stash V1.0 Final"
          echo "===================================="
          echo " SOURCE : Sukka List"
          echo " FORMAT : Stash"
          echo " SYNC   : 24 hours"
          echo " STATUS : SUCCESS"
          echo "===================================="
