              + summary["duplicates_removed"]
              + summary["output_rules"]
          )


          print("")
          print("====================================")
          print(" Rule Conservation Check")
          print("====================================")
          print(f" Source     : {source}")
          print(f" Accounted  : {accounted}")
          print(
              f" Unaccounted: "
              f"{source - accounted}"
          )
          print("====================================")


          if source != accounted:

              raise RuntimeError(
                  "Global semantic integrity "
                  "check failed."
              )


          if summary["unaccounted_rules"] != 0:

              raise RuntimeError(
                  "Unaccounted rules detected."
              )


          bad_files = [
              item
